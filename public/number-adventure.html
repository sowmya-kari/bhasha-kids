const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function word(n){return state.lang==='te'?TE[n]:HI[n]} function roman(n){return state.lang==='te'?ROMAN_TE[n]:ROMAN_HI[n]} function lc(){return state.lang==='te'?'te':'hi'} function txt(te,hi){return state.lang==='te'?te:hi}
function speak(t){state.spoken=t;if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=state.lang==='te'?'te-IN':'hi-IN';u.rate=.78;u.pitch=1.02;speechSynthesis.speak(u)}
function setPrompt(t,auto=false){state.spoken=t;$('#promptText').innerHTML=`<span class="${lc()}">${t}</span>`;if(auto)setTimeout(()=>speak(t),250)}
function addStar(){state.stars++;$('#stars').textContent=state.stars;$('#stageStars').textContent=state.stars;state.done.add(`${state.lang}-${state.num}`)}
function feedback(t,good=true){$('#feedback').innerHTML=`<span class="${lc()}" style="color:${good?'#2d9137':'#d04b42'}">${t}</span>`}
function renderNums(){const w=$('#homeNums');w.innerHTML='';for(let n=state.min;n<=state.max;n++){const b=document.createElement('button');b.className='num'+(n===state.num?' active':'')+(state.done.has(`${state.lang}-${n}`)?' done':'');b.textContent=n;b.onclick=()=>{state.num=n;state.tracePassed=false;state.countPassed=false;state.rescuePassed=false;renderHome();};w.appendChild(b)}}
function renderHome(){renderNums();const hv=$('#homeVageesh');if(hv)hv.src=ART.stand;$('#prevNum1').textContent=state.num;$('#prevNum2').textContent=state.num;$('#prevObjects').textContent=state.num===0?'—':Array.from({length:Math.min(state.num,10)},()=> '🥭').join(' ');$('#homeBubble').innerHTML=`<span class="${lc()}">${txt(`${state.num} — ${word(state.num)}. ఈ సంఖ్యను నేర్చుకుందాం!`,`${state.num} — ${word(state.num)}. यह संख्या सीखें!`)}</span>`;$$('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===state.lang));$$('[data-range]').forEach(b=>b.classList.toggle('active',b.dataset.range===`${state.min}-${state.max}`))}

function renderStep(){$$('[data-step]').forEach(b=>b.classList.toggle('active',b.dataset.step===state.step));const title={learn:'See & Hear',trace:'Trace the Number',count:'Count & Give',rescue:'River Rescue'};$('#stageTitle').textContent=title[state.step];$('#stageStars').textContent=state.stars;$('#feedback').textContent='';$('#nextRow').innerHTML='';$('#content').innerHTML='';if(state.step==='learn')renderLearn();if(state.step==='trace')renderTrace();if(state.step==='count')renderCount();if(state.step==='rescue')renderRescue()}
function nextButton(label,next,disabled=false){const b=document.createElement('button');b.className='cta';b.textContent=label;b.disabled=disabled;b.onclick=()=>{state.step=next;renderStep()};$('#nextRow').appendChild(b);return b}
function renderLearn(){const n=state.num;const sentence=txt(`ఇది ${n}. ${n} ను ${word(n)} అంటారు. ఇది ${word(n)} సంఖ్య.`,`यह ${n} है। ${n} को ${word(n)} कहते हैं। यह ${word(n)} संख्या है।`);setPrompt(sentence,true);$('#content').innerHTML=`<div style="display:grid;grid-template-columns:minmax(160px,230px) 1fr;gap:12px;align-items:center;width:100%;max-width:900px"><div style="height:330px;display:flex;align-items:flex-end;justify-content:center"><img src="${ART.point}" alt="Vageesh pointing" style="max-width:230px;max-height:330px;object-fit:contain;filter:drop-shadow(0 10px 8px #0003);animation:artBob 2.8s ease-in-out infinite"></div><div class="learn-center"><div class="hero-number">${n}</div><div class="hero-word ${lc()}">${word(n)}</div><div class="roman">${roman(n)} • Number ${n}</div><div class="objects">${n===0?'—':Array.from({length:Math.min(n,20)},()=> '⭐').join(' ')}</div></div></div>`;nextButton(txt(`Trace ${n} →`,`Trace ${n} →`),'trace')}
function renderTrace(){const n=state.num;const sentence=txt(`${word(n)}. ఇప్పుడు ${n} సంఖ్యను గీతపై నెమ్మదిగా గీయండి.`,`${word(n)}। अब ${n} को लाइन पर धीरे-धीरे ट्रेस करो।`);setPrompt(sentence,true);$('#content').innerHTML=`<div style="width:100%;display:flex;flex-direction:column;align-items:center"><div class="trace-box"><div class="trace-note ${lc()}">${txt('గీతపైనే గీయండి','लाइन पर ट्रेस करो')}</div><div class="trace-ghost">${n}</div><canvas id="traceCanvas" width="720" height="440"></canvas></div><div class="meter"><div id="meterFill"></div></div></div>`;const next=nextButton(txt('Count & Give →','Count & Give →'),'count',!state.tracePassed);setupTrace(n,next)}
function setupTrace(n,next){const c=$('#traceCanvas'),ctx=c.getContext('2d'),mask=document.createElement('canvas');mask.width=c.width;mask.height=c.height;const m=mask.getContext('2d');const fontSize=n>=10?270:340;m.font=`800 ${fontSize}px 'Baloo 2', sans-serif`;m.textAlign='center';m.textBaseline='middle';m.lineJoin='round';m.strokeStyle='#fff';m.fillStyle='#fff';m.lineWidth=72;m.strokeText(String(n),c.width/2,c.height/2+10);m.fillText(String(n),c.width/2,c.height/2+10);const data=m.getImageData(0,0,c.width,c.height).data;let draw=false,pts=[],inside=0,total=0,minX=9999,maxX=0,minY=9999,maxY=0;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=25;ctx.strokeStyle='#ff9b25';function pos(e){const r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*c.width/r.width,y:(t.clientY-r.top)*c.height/r.height}}function valid(p){const x=Math.max(0,Math.min(c.width-1,Math.round(p.x))),y=Math.max(0,Math.min(c.height-1,Math.round(p.y)));return data[(y*c.width+x)*4+3]>0}function start(e){draw=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);record(p);e.preventDefault()}function move(e){if(!draw)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();record(p);e.preventDefault()}function end(){draw=false;check(false)}function record(p){total++;if(valid(p))inside++;minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);pts.push(p);const acc=total?Math.round(inside/total*100):0;$('#meterFill').style.width=Math.min(100,acc)+'%'}function check(final){if(total<18){if(final)feedback(txt('కొంచెం ఎక్కువగా గీయండి.','थोड़ा और ट्रेस करो।'),false);return}const acc=inside/total;const coverageW=(maxX-minX)/(n>=10?330:260),coverageH=(maxY-minY)/(n>=10?260:300);if(acc>=.72&&coverageW>=.48&&coverageH>=.52){state.tracePassed=true;next.disabled=false;feedback(txt(`${word(n)} చాలా బాగా గీశావు!`,`${word(n)} बहुत अच्छा ट्रेस किया!`));}else if(final){feedback(txt('గీతను మరింత దగ్గరగా అనుసరించు. మళ్లీ ప్రయత్నించు!','लाइन के और पास ट्रेस करो। फिर से कोशिश करो!'),false)}}c.addEventListener('pointerdown',start);c.addEventListener('pointermove',move);c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);const checkBtn=document.createElement('button');checkBtn.className='cta alt';checkBtn.textContent=txt('✓ Check Tracing','✓ Check Tracing');checkBtn.onclick=()=>check(true);$('#nextRow').prepend(checkBtn)}
function makeDraggable(el,onDrop){let clone=null;el.addEventListener('pointerdown',e=>{if(el.classList.contains('placed'))return;el.setPointerCapture(e.pointerId);el.classList.add('dragging');const move=ev=>{el.style.position='fixed';el.style.left=(ev.clientX-39)+'px';el.style.top=(ev.clientY-34)+'px';el.style.zIndex=999};move(e);const up=ev=>{el.classList.remove('dragging');onDrop(el,ev.clientX,ev.clientY);el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up)};el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)})}
function resetDragged(el){el.style.position='';el.style.left='';el.style.top='';el.style.zIndex=''}
function basketFruitPositions(total){const width=220,rows=total<=6?1:total<=12?2:3,positions=[];let placed=0;const rowYs=rows===1?[34]:rows===2?[36,8]:[42,22,2];for(let row=0;row<rows;row++){const left=total-placed;const rowCount=Math.ceil(left/(rows-row));const gap=Math.min(36,rowCount>1?170/(rowCount-1):0);const start=110-gap*(rowCount-1)/2;for(let i=0;i<rowCount;i++){positions.push({x:start+i*gap,y:rowYs[row]});placed++}}return positions}
function addFruitToBasket(count,total){const layer=$('#basketFruits');if(!layer)return;const positions=basketFruitPositions(total);const p=positions[count-1]||{x:110,y:34};const fruit=document.createElement('div');fruit.className='basket-fruit';fruit.textContent='🥭';fruit.style.left=(p.x-17)+'px';fruit.style.top=p.y+'px';layer.appendChild(fruit)}
function renderCount(){
 const target=Math.max(1,state.num);
 setPrompt(txt(`వాగీశ్ కి ${word(target)} మామిడిపండ్లు బుట్టలో వేయి. ఒక్కొక్క పండు వేస్తూ లెక్కించు!`,`वागीश की टोकरी में ${word(target)} आम डालो। एक-एक आम डालते हुए गिनो!`),true);
 $('#content').innerHTML=`<div class="drag-scene">
   <div class="basket-scene">
     <div class="guide-mini"><img id="countVageesh" src="${ART.point}" alt="Vageesh helping count"></div>
     <div class="tree-mini">🌳</div>
     <div class="basket"></div>
     <div class="basket-fruits" id="basketFruits"></div>
     <div class="drop-zone" id="fruitDrop"></div>
     <div class="counter"><span id="fruitCount">0</span> / ${target}</div>
   </div>
   <div class="items" id="fruitItems"></div>
 </div>`;
 const holder=$('#fruitItems'),drop=$('#fruitDrop');
 const visibleSource=Math.min(target+2,target>=11?8:target+2);
 for(let i=0;i<visibleSource;i++) addCountFruit(holder,drop,target);
 const next=nextButton(txt('River Rescue →','River Rescue →'),'rescue',!state.countPassed);
 function addCountFruit(holder,drop,target){
   const f=document.createElement('div');f.className='fruit-item';f.textContent='🥭';holder.appendChild(f);
   makeDraggable(f,(el,x,y)=>{
     const r=drop.getBoundingClientRect();
     const current=+$('#fruitCount').textContent;
     if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom&&current<target){
       const count=current+1;$('#fruitCount').textContent=count;
       el.remove();addFruitToBasket(count,target);speak(word(count));
       if(count<target && holder.querySelectorAll('.fruit-item').length < Math.min(8,target-count+2)) addCountFruit(holder,drop,target);
       if(count===target){state.countPassed=true;addStar();feedback(txt(`${word(target)} మామిడిపండ్లు బుట్టలో పడ్డాయి! చాలా బాగుంది!`,`${word(target)} आम टोकरी में हैं! बहुत बढ़िया!`));next.disabled=false;const vg=$('#countVageesh');if(vg){vg.src=ART.jump;setTimeout(()=>vg.src=ART.point,1100)}}
     }else resetDragged(el)
   });
 }
}
function buildRescueSlots(target){const scene=$('#riverScene'),wrap=$('#slots');if(!scene||!wrap)return[];wrap.innerHTML='';const w=scene.clientWidth,h=scene.clientHeight;let points=[];if(target<=8){for(let i=0;i<target;i++){const t=target===1?.5:i/(target-1);points.push({x:w*(0.28+t*0.44),y:h*(0.57-Math.sin(t*Math.PI)*0.08)})}}else if(target<=12){const row1=Math.ceil(target/2),row2=target-row1;for(let i=0;i<row1;i++){const t=row1===1?.5:i/(row1-1);points.push({x:w*(0.24+t*0.52),y:h*0.52})}for(let i=0;i<row2;i++){const t=row2===1?.5:i/(row2-1);points.push({x:w*(0.28+t*0.44),y:h*0.64})}}else if(target<=16){const counts=[6,5,target-11],ys=[0.49,0.59,0.69];counts.forEach((count,row)=>{for(let i=0;i<count;i++){const t=count===1?.5:i/(count-1);const span=row===0?0.56:row===1?0.48:0.40;const start=0.22+(0.56-span)/2;points.push({x:w*(start+t*span),y:h*ys[row]})}})}else{const counts=[7,7,target-14],ys=[0.47,0.58,0.69];counts.forEach((count,row)=>{for(let i=0;i<count;i++){const t=count===1?.5:i/(count-1);const span=row===0?0.60:row===1?0.56:0.40;const start=0.20+(0.60-span)/2;points.push({x:w*(start+t*span),y:h*ys[row]})}})}const size=target<=8?92:target<=12?76:target<=16?62:54;points.forEach((p,i)=>{const slot=document.createElement('div');slot.className='slot';slot.dataset.i=i;slot.style.width=size+'px';slot.style.height=Math.round(size*.68)+'px';slot.style.left=p.x+'px';slot.style.top=p.y+'px';wrap.appendChild(slot)});return [...wrap.children]}
function sourceStoneCount(target){if(target<=5)return target+1;if(target<=10)return 5;return 4}
function updateNextRescueSlotHighlight(){const slots=$$('.slot');slots.forEach(sl=>sl.classList.remove('hover'));const next=slots.find(sl=>!sl.dataset.filled);if(next)next.classList.add('hover')}
function refillStoneSource(target){const pile=$('#stonePile');if(!pile)return;const active=[...pile.querySelectorAll('.stone-item:not(.placed)')].length;const desired=sourceStoneCount(target);for(let i=active;i<desired;i++){const s=document.createElement('div');s.className='stone-item source-stone';s.setAttribute('aria-label','stone');s.title='Tap stone';pile.appendChild(s);wireStoneDrag(s,target)}updateNextRescueSlotHighlight()}
function wireStoneDrag(s,target){const placeStone=()=>{if(s.classList.contains('placed'))return;const slots=$$('.slot');const empty=slots.find(sl=>!sl.dataset.filled);if(!empty||+$('#stoneCount').textContent>=target)return;empty.dataset.filled='1';empty.classList.add('filled');empty.appendChild(s);s.classList.add('placed');s.classList.remove('source-stone');s.style.animation='none';s.style.cursor='default';s.style.width=empty.clientWidth+'px';s.style.height=empty.clientHeight+'px';const count=+$('#stoneCount').textContent+1;$('#stoneCount').textContent=count;speak(word(count));const rr=empty.getBoundingClientRect();const sr=$('#riverScene').getBoundingClientRect();for(let k=0;k<4;k++){const sp=document.createElement('span');sp.className='crossing-spark';sp.textContent=k%2?'⭐':'✨';sp.style.left=(rr.left-sr.left+rr.width/2+(k-1.5)*14)+'px';sp.style.top=(rr.top-sr.top+10)+'px';$('#riverScene').appendChild(sp);setTimeout(()=>sp.remove(),800)}refillStoneSource(target);if(count===target){state.rescuePassed=true;addStar();const rv=$('#riverVageeshImg');if(rv){rv.src=ART.jump;$('#riverVageesh').classList.add('celebrate');setTimeout(()=>{rv.src=ART.rock;$('#riverVageesh').classList.remove('celebrate')},1200)}feedback(txt(`${word(target)} రాళ్లు! ఇప్పుడు కుందేలు దాటుతుంది!`,`${word(target)} पत्थर! अब खरगोश पार करेगा!`));const finish=document.getElementById('rescueFinishBtn');animateBunnyCrossing($$('.slot'),()=>{if(finish)finish.disabled=false;feedback(txt('కుందేలు నది దాటింది! చాలా బాగుంది!','खरगोश नदी पार कर गया! बहुत बढ़िया!'))})}};s.addEventListener('click',placeStone);s.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();placeStone()}})}
function renderRescue(){
 const target=Math.max(1,state.num);
 setPrompt(txt(`కుందేలికి దాటడానికి ${word(target)} రాళ్లు పెట్టు. కింద ఉన్న రాళ్లను నొక్కుతూ లెక్కించు!`,`खरगोश को पार कराने के लिए ${word(target)} पत्थर रखो। नीचे के पत्थरों को टैप करते हुए गिनो!`),true);
 $('#content').innerHTML=`<div class="river-scene" id="riverScene">
   <div class="river-sky-cloud c1"></div><div class="river-sky-cloud c2"></div><div class="river-hill"></div>
   <div class="bank left"></div><div class="bank right"></div><div class="river-reeds left">🌿</div><div class="river-reeds right">🌾</div><div class="river-rock r1"></div><div class="river-rock r2"></div>
   <div class="vmini" id="riverVageesh"><img id="riverVageeshImg" src="${ART.rock}" alt="Vageesh placing a stepping stone"></div>
   <div class="bunny" id="bunny"><img src="${ART.bunny}" alt="Bunny waiting to cross"></div>
   <div class="rescue-instruction ${lc()}">${txt('కింద ఉన్న రాళ్లను నొక్కు','नीचे के पत्थरों को टैप करो')}</div>
   <div class="rescue-count"><span id="stoneCount">0</span> / ${target}</div>
   <div class="slots" id="slots"></div>
   <div class="stone-pile ${target>=11?'small-source':''} ${target>=17?'compact':''}" id="stonePile"></div>
 </div>`;
 const slots=buildRescueSlots(target);
 refillStoneSource(target);
  const finish=document.createElement('button');finish.id='rescueFinishBtn';finish.className='cta';finish.textContent=txt('✓ Finish This Number','✓ Finish This Number');finish.disabled=!state.rescuePassed;finish.onclick=renderFinish;$('#nextRow').appendChild(finish)
}
function animateBunnyCrossing(slots,done){
 const bunny=$('#bunny'),scene=$('#riverScene'); if(!bunny||!scene){done&&done();return}
 bunny.style.animation='none';
 bunny.style.zIndex='14';
 bunny.style.transformOrigin='50% 100%';
 const sceneR=scene.getBoundingClientRect();
 // Land the bunny by its FEET on the top surface of each stone, not by its center.
 const points=slots.map(sl=>{const r=sl.getBoundingClientRect();return{x:r.left-sceneR.left+r.width/2,y:r.top-sceneR.top+6}});
 const start=bunny.getBoundingClientRect();
 const startFootX=start.left-sceneR.left+start.width/2;
 const startFootY=start.bottom-sceneR.top-4;
 const end={x:sceneR.width*.17,y:sceneR.height*.72};
 const route=[...points.reverse(),end];
 let prev={x:startFootX,y:startFootY};let idx=0;
 function hop(){
   if(idx>=route.length){done&&done();return}
   const p=route[idx++],dx=p.x-prev.x,dy=p.y-prev.y;
   const fromX=prev.x-startFootX,fromY=prev.y-startFootY;
   const toX=p.x-startFootX,toY=p.y-startFootY;
   const arc=Math.max(54,Math.min(88,Math.abs(dx)*.32));
   bunny.animate([
     {transform:`translate(${fromX}px,${fromY}px) scale(1,1)`,offset:0},
     {transform:`translate(${fromX+dx*.18}px,${fromY+dy*.18-18}px) scale(1.05,.94)`,offset:.18},
     {transform:`translate(${fromX+dx*.52}px,${fromY+dy*.52-arc}px) scale(.96,1.06)`,offset:.52},
     {transform:`translate(${toX}px,${toY-7}px) scale(1.05,.95)`,offset:.88},
     {transform:`translate(${toX}px,${toY}px) scale(1,1)`,offset:1}
   ],{duration:620,easing:'cubic-bezier(.28,.72,.35,1)',fill:'forwards'}).onfinish=()=>{
     prev=p;
     for(let k=0;k<3;k++){const sp=document.createElement('span');sp.className='crossing-spark';sp.textContent='✨';sp.style.zIndex='15';sp.style.left=(p.x+(k-1)*14)+'px';sp.style.top=(p.y-18)+'px';scene.appendChild(sp);setTimeout(()=>sp.remove(),800)}
     setTimeout(hop,110)
   }
 }
 hop()
}
function renderFinish(){state.done.add(`${state.lang}-${state.num}`);$('#content').innerHTML=`<div class="finish-card" style="text-align:center"><img src="${ART.jump}" alt="Vageesh celebrating" style="width:min(260px,60vw);max-height:330px;object-fit:contain;filter:drop-shadow(0 10px 8px #0003);animation:artCelebrate .9s cubic-bezier(.2,1.4,.4,1)"><div class="big">🎉 ⭐ 🎉</div><h2 class="${lc()}">${txt(`${state.num} — ${word(state.num)} నేర్చుకున్నావు!`,`${state.num} — ${word(state.num)} सीख लिया!`)}</h2><p>${roman(state.num)} • Number ${state.num}</p></div>`;$('#promptText').textContent=txt('Great job!','Great job!');$('#nextRow').innerHTML='';const b=document.createElement('button');b.className='cta';b.textContent=txt('Next Number →','Next Number →');b.onclick=()=>{if(state.num<state.max)state.num++;state.tracePassed=state.countPassed=state.rescuePassed=false;state.step='learn';renderStep()};$('#nextRow').appendChild(b)}
$('#audioBtn').onclick=()=>speak(state.spoken);$('#backHome').onclick=showHome;$('#startLesson').onclick=()=>showLesson('learn');$$('[data-jump]').forEach(b=>b.onclick=()=>showLesson(b.dataset.jump));$$('[data-step]').forEach(b=>b.onclick=()=>{state.step=b.dataset.step;renderStep()});$$('[data-lang]').forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;state.tracePassed=state.countPassed=state.rescuePassed=false;renderHome();if($('#lesson').classList.contains('active'))renderStep()});$$('[data-range]').forEach(b=>b.onclick=()=>{const[a,z]=b.dataset.range.split('-').map(Number);state.min=a;state.max=z;if(state.num<a||state.num>z)state.num=a;state.tracePassed=state.countPassed=state.rescuePassed=false;renderHome()});renderHome();
</script>
