<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Vani's Little Garden Sort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@600;700&family=Noto+Sans+Telugu:wght@600;700&family=Noto+Sans+Devanagari:wght@600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    font-family:'Quicksand',sans-serif;color:#3a2a6b;background:#e9f6e6;}
  .fit{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  .stage{position:relative;width:min(100%, calc(100vh * 1.5));aspect-ratio:3/2;container-type:inline-size;--k:1;
    display:flex;flex-direction:column;overflow:hidden;
    background:
      radial-gradient(60cqw 26cqw at 50% 104%, #bfe6a4 0 60%, transparent 62%),
      linear-gradient(#dff1ff 0 44%, #eaf8e2 44% 100%);}
  .stage::after{content:'';position:absolute;left:0;right:0;bottom:0;height:22%;
    background:linear-gradient(transparent, rgba(126,186,110,.45));pointer-events:none;}
  .stage > *{position:relative;z-index:2;}

  .top{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--k)*2cqw) calc(var(--k)*2.6cqw) 0;}
  .back,.speak{border:calc(var(--k)*.22cqw) solid #e0d5f7;background:#fdfbff;cursor:pointer;border-radius:50%;
    width:calc(var(--k)*5.4cqw);height:calc(var(--k)*5.4cqw);font-size:calc(var(--k)*2.4cqw);line-height:1;
    display:flex;align-items:center;justify-content:center;box-shadow:0 calc(var(--k)*.4cqw) calc(var(--k)*1cqw) rgba(90,60,140,.15);}
  .back:active,.speak:active{transform:scale(.92);}
  .counter{display:flex;align-items:center;gap:calc(var(--k)*1cqw);padding:calc(var(--k)*1cqw) calc(var(--k)*2.2cqw);
    border-radius:99px;background:#fdfbff;border:calc(var(--k)*.22cqw) solid #e0d5f7;
    font-family:'Baloo 2',cursive;font-weight:800;font-size:calc(var(--k)*2.1cqw);color:#5b3fae;white-space:nowrap;
    box-shadow:0 calc(var(--k)*.4cqw) calc(var(--k)*1cqw) rgba(90,60,140,.14);}
  .counter i{font-style:normal;color:#e8a33d;}

  .ask{display:flex;flex-direction:column;align-items:center;gap:calc(var(--k)*.4cqw);
    margin:calc(var(--k)*1.2cqw) auto 0;padding:calc(var(--k)*1.3cqw) calc(var(--k)*3.4cqw);max-width:86%;
    border-radius:calc(var(--k)*3cqw);background:rgba(255,253,246,.94);border:calc(var(--k)*.25cqw) solid #f0e4c4;
    box-shadow:0 calc(var(--k)*.8cqw) calc(var(--k)*2cqw) rgba(80,70,30,.14);text-align:center;}
  .ask b{font-family:'Noto Sans Telugu','Noto Sans Devanagari','Baloo 2',sans-serif;font-weight:700;
    font-size:calc(var(--k)*3.4cqw);line-height:1.25;color:#4b3fb0;}
  .ask span{font-family:'Baloo 2',cursive;font-weight:700;font-size:calc(var(--k)*1.9cqw);color:#7a7290;letter-spacing:.02em;}

  .tray{flex:1;display:flex;align-items:center;justify-content:center;gap:calc(var(--k)*2.4cqw);
    padding:calc(var(--k)*1cqw) calc(var(--k)*3cqw);min-height:0;}
  .card{border:calc(var(--k)*.3cqw) solid #ddd2f4;background:#fdfcff;cursor:pointer;
    border-radius:calc(var(--k)*2.6cqw);padding:calc(var(--k)*1.2cqw);min-width:calc(var(--k)*15cqw);
    height:100%;max-height:calc(var(--k)*26cqw);display:flex;align-items:center;justify-content:center;
    box-shadow:0 calc(var(--k)*.55cqw) 0 #ded3f5, 0 calc(var(--k)*1cqw) calc(var(--k)*1.6cqw) rgba(90,60,140,.12);
    transition:transform .12s;}
  .card:active{transform:translateY(calc(var(--k)*.4cqw));}
  .card.right{border-color:#5fc48d;background:#f0fbf4;box-shadow:0 calc(var(--k)*.55cqw) 0 #bfe9cf;}
  .card.no{border-color:#ef9aa8;background:#fdf1f3;animation:shake .35s;}
  .card.gone{opacity:0;transform:scale(.3) translateY(calc(var(--k)*6cqw));transition:all .45s ease-in;pointer-events:none;}
  .card .glyph{font-size:calc(var(--k)*11cqw);line-height:1;display:block;}
  .card .cluster{display:flex;flex-wrap:wrap;gap:calc(var(--k)*.5cqw);justify-content:center;max-width:calc(var(--k)*17cqw);}
  .card .cluster span{font-size:calc(var(--k)*4.6cqw);line-height:1;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(calc(var(--k)*-.8cqw));}75%{transform:translateX(calc(var(--k)*.8cqw));}}
  @keyframes pop{0%{transform:scale(.4);}70%{transform:scale(1.14);}100%{transform:scale(1);}}

  .slots{display:flex;align-items:center;justify-content:center;gap:calc(var(--k)*1.6cqw);padding:0 calc(var(--k)*3cqw);}
  .slots[hidden]{display:none;}
  .slot{width:calc(var(--k)*11cqw);height:calc(var(--k)*9cqw);border-radius:calc(var(--k)*2cqw);
    border:calc(var(--k)*.32cqw) dashed #b9a7e6;background:rgba(255,255,255,.62);
    display:flex;align-items:center;justify-content:center;font-size:calc(var(--k)*5.4cqw);line-height:1;
    font-family:'Baloo 2',cursive;font-weight:800;color:#b9a7e6;}
  .slot.filled{border-style:solid;border-color:#5fc48d;background:#fff;animation:pop .4s cubic-bezier(.3,1.6,.5,1);}
  .arrow{font-size:calc(var(--k)*2.6cqw);color:#8b7fc4;}

  .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:calc(var(--k)*2cqw);
    padding:0 calc(var(--k)*2.6cqw) calc(var(--k)*2cqw);}
  .vani{display:flex;align-items:flex-end;gap:calc(var(--k)*1cqw);min-width:0;}
  .vani img{width:calc(var(--k)*13cqw);display:block;filter:drop-shadow(0 calc(var(--k)*.8cqw) calc(var(--k)*1.2cqw) rgba(60,50,20,.18));}
  .bubble{padding:calc(var(--k)*1.4cqw) calc(var(--k)*2cqw);border-radius:calc(var(--k)*2.4cqw) calc(var(--k)*2.4cqw) calc(var(--k)*2.4cqw) calc(var(--k)*.7cqw);
    background:rgba(255,255,255,.94);border:calc(var(--k)*.24cqw) solid #e6dcf6;max-width:calc(var(--k)*40cqw);
    font-family:'Noto Sans Telugu','Noto Sans Devanagari','Baloo 2',sans-serif;font-weight:700;
    font-size:calc(var(--k)*2cqw);line-height:1.35;color:#4b3fb0;
    box-shadow:0 calc(var(--k)*.7cqw) calc(var(--k)*1.6cqw) rgba(70,50,20,.14);}
  .bubble.good{background:rgba(233,250,240,.96);border-color:#bfe9cf;color:#1b8c56;}
  .bubble.oops{background:rgba(253,241,243,.96);border-color:#f6cdd4;color:#c2566c;}

  .basketwrap{display:flex;flex-direction:column;align-items:center;gap:calc(var(--k)*.6cqw);}
  .basket{position:relative;width:calc(var(--k)*17cqw);min-height:calc(var(--k)*9cqw);
    border-radius:calc(var(--k)*1.4cqw) calc(var(--k)*1.4cqw) calc(var(--k)*3.4cqw) calc(var(--k)*3.4cqw);
    background:linear-gradient(#e6b877,#cf9a52);border:calc(var(--k)*.3cqw) solid #b57f3c;
    display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:calc(var(--k)*.4cqw);
    padding:calc(var(--k)*.8cqw);box-shadow:inset 0 calc(var(--k)*.8cqw) 0 rgba(255,255,255,.25);}
  .basket span{font-size:calc(var(--k)*3cqw);line-height:1;animation:pop .4s cubic-bezier(.3,1.6,.5,1);}
  .basketwrap small{font-family:'Baloo 2',cursive;font-weight:800;font-size:calc(var(--k)*1.6cqw);color:#7a6a4a;}

  .spark{position:absolute;font-size:calc(var(--k)*3cqw);pointer-events:none;z-index:6;animation:floatUp 1.1s ease-out forwards;}
  @keyframes floatUp{0%{opacity:0;transform:translateY(1cqw) scale(.4) rotate(0);}25%{opacity:1;}100%{opacity:0;transform:translateY(-8cqw) scale(1.1) rotate(140deg);}}

  .veil{position:absolute;inset:0;z-index:9;background:rgba(74,45,120,.42);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;}
  .veil[hidden]{display:none;}
  .sheet{background:#fffdf6;border-radius:calc(var(--k)*4cqw);padding:calc(var(--k)*3.4cqw) calc(var(--k)*4cqw);
    text-align:center;max-width:64%;border:calc(var(--k)*.3cqw) solid #f0e4c4;box-shadow:0 2cqw 4cqw rgba(50,30,80,.3);}
  .sheet .big{font-size:calc(var(--k)*8cqw);line-height:1;}
  .sheet h2{font-family:'Baloo 2',cursive;font-size:calc(var(--k)*3.4cqw);margin:calc(var(--k)*.8cqw) 0 calc(var(--k)*.4cqw);color:#5b3fae;}
  .sheet p{margin:0 0 calc(var(--k)*1.8cqw);font-weight:700;font-size:calc(var(--k)*1.9cqw);line-height:1.4;color:#6d768b;
    font-family:'Noto Sans Telugu','Noto Sans Devanagari',Quicksand,sans-serif;}
  .next{background:#6c5ce7;color:#fff;border:none;border-radius:99px;cursor:pointer;
    padding:calc(var(--k)*1.5cqw) calc(var(--k)*3.4cqw);font-family:'Baloo 2',cursive;font-weight:800;
    font-size:calc(var(--k)*2.3cqw);box-shadow:0 calc(var(--k)*.55cqw) 0 #4b3fb0;}
  .next:active{transform:translateY(calc(var(--k)*.4cqw));box-shadow:0 calc(var(--k)*.15cqw) 0 #4b3fb0;}

  html.portrait,html.portrait body{overflow:auto;}
  html.portrait .stage{width:100%;aspect-ratio:auto;min-height:100%;--k:2.05;}
  html.portrait .tray{flex:none;flex-wrap:wrap;padding:calc(var(--k)*2cqw);}
  html.portrait .card{height:auto;max-height:none;min-width:calc(var(--k)*13cqw);}
  html.portrait .foot{flex-direction:column;align-items:center;gap:calc(var(--k)*1.6cqw);}
  html.portrait .bubble{max-width:calc(var(--k)*30cqw);}
  html.portrait .sheet{max-width:86%;}
</style>
</head>
<body>
<div class="fit">
  <div class="stage" id="stage">
    <div class="top">
      <button class="back" id="back" aria-label="Back">←</button>
      <div class="counter" id="counter"></div>
    </div>
    <div class="ask">
      <b id="askNative"></b>
      <span id="askEn"></span>
    </div>
    <div class="tray" id="tray"></div>
    <div class="slots" id="slots" hidden></div>
    <div class="foot">
      <div class="vani">
        <img src="assets/images/vani.png" alt="Vani">
        <div class="bubble" id="bubble"></div>
        <button class="speak" id="speak" aria-label="Hear Vani">🔊</button>
      </div>
      <div class="basketwrap">
        <div class="basket" id="basket"></div>
        <small id="basketLabel"></small>
      </div>
    </div>
    <div class="veil" id="veil" hidden>
      <div class="sheet">
        <div class="big" id="sheetIcon">🌟</div>
        <h2 id="sheetTitle"></h2>
        <p id="sheetText"></p>
        <button class="next" id="sheetBtn"></button>
      </div>
    </div>
  </div>
</div>
<script>
const LANG = (new URLSearchParams(location.search).get('lang') === 'hi') ? 'hi' : 'te';
const T = {
  te:{
    big:'పెద్దది', small:'చిన్నది', tall:'ఎత్తైనది', short:'పొట్టిది',
    long:'పొడవైనది', shortL:'పొట్టిది', more:'ఎక్కువ', less:'తక్కువ',
    q:w=>w+' ఏది?', order:'చిన్నది నుండి పెద్దది వరకు సర్దండి!',
    praise:['చాలా బాగా చేసావు! ✨','భలే! ⭐','అద్భుతం! 🌸'],
    oops:'మళ్ళీ ప్రయత్నించు.',
    hello:'నా తోటలో సాయం చేస్తావా?',
    basket:'వాని బుట్ట', level:'స్థాయి',
    doneTitle:'బుట్ట నిండిపోయింది!', doneText:'అన్నీ సరిగ్గా సర్దావు. మళ్ళీ ఆడదామా?', again:'మళ్ళీ ఆడు',
    lvlUp:'తర్వాతి స్థాయి!', go:'సరే!'
  },
  hi:{
    big:'बड़ा', small:'छोटा', tall:'ऊँचा', short:'नाटा',
    long:'लम्बा', shortL:'छोटा', more:'ज़्यादा', less:'कम',
    q:w=>w+' कौन सा है?', order:'छोटे से बड़े तक सजाओ!',
    praise:['बहुत बढ़िया! ✨','शाबाश! ⭐','कमाल! 🌸'],
    oops:'फिर से कोशिश करो.',
    hello:'मेरे बगीचे में मदद करोगे?',
    basket:'वाणी की टोकरी', level:'स्तर',
    doneTitle:'टोकरी भर गई!', doneText:'सब कुछ सही सजाया. फिर से खेलें?', again:'फिर से खेलो',
    lvlUp:'अगला स्तर!', go:'चलो!'
  }
}[LANG];
const EN = { big:'Which one is BIG?', small:'Which one is SMALL?', tall:'Which one is TALL?',
  short:'Which one is SHORT?', long:'Which one is LONG?', shortL:'Which one is SHORT?',
  more:'Which has MORE?', less:'Which has LESS?', order:'Put them SMALL to BIG!' };
const LEVEL_EN = { 1:'Big / Small', 2:'Tall / Short', 3:'Long / Short', 4:'More / Less', 5:'Order them' };

const ROUNDS = [
  {lv:1, ask:'big',   items:[{e:'🍎',s:1.35},{e:'🍎',s:.66},{e:'🍎',s:1.0}]},
  {lv:1, ask:'small', items:[{e:'🍐',s:1.0},{e:'🍐',s:1.4},{e:'🍐',s:.62}]},
  {lv:1, ask:'big',   items:[{e:'🐘',s:1.5},{e:'🐭',s:.6}]},
  {lv:2, ask:'tall',  items:[{e:'🌳',s:1.45},{e:'🌱',s:.6},{e:'🌳',s:1.0}]},
  {lv:2, ask:'short', items:[{e:'🌻',s:1.35},{e:'🌷',s:.68}]},
  {lv:3, ask:'long',  items:[{e:'🪱',s:1.45},{e:'🐛',s:.72}]},
  {lv:3, ask:'shortL',items:[{e:'🐍',s:1.5},{e:'🐛',s:.75}]},
  {lv:4, ask:'more',  items:[{e:'🍎',n:4},{e:'🍎',n:2}]},
  {lv:4, ask:'less',  items:[{e:'🍓',n:2},{e:'🍓',n:5}]},
  {lv:4, ask:'more',  items:[{e:'🥕',n:3},{e:'🥕',n:6}]},
  {lv:5, ask:'order', items:[{e:'🐭',s:.58},{e:'🐘',s:1.5},{e:'🐱',s:.95}]},
  {lv:5, ask:'order', items:[{e:'🌱',s:.58},{e:'🌳',s:1.45},{e:'🌿',s:.92}]},
];

const $ = id => document.getElementById(id);
let idx = 0, basket = [], picked = [], lastLv = 0, locked = false;

function fit(){
  document.documentElement.classList.toggle('portrait', window.innerHeight > window.innerWidth * 1.05);
}
fit(); addEventListener('resize', fit);

function val(it){ return it.n != null ? it.n : it.s; }
function answerIndex(r){
  const want = ['big','tall','long','more'].includes(r.ask) ? 'max' : 'min';
  let best = 0;
  r.items.forEach((it,i)=>{ if (want === 'max' ? val(it) > val(r.items[best]) : val(it) < val(r.items[best])) best = i; });
  return best;
}
function askText(r){ return r.ask === 'order' ? T.order : T.q(T[r.ask]); }

function speak(text){
  if (!window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = LANG === 'hi' ? 'hi-IN' : 'te-IN';
    u.rate = .85;
    speechSynthesis.speak(u);
  } catch(e){}
}

function sparkle(el){
  const s = document.createElement('div');
  s.className = 'spark'; s.textContent = '✨';
  const b = el.getBoundingClientRect(), st = $('stage').getBoundingClientRect();
  s.style.left = (b.left - st.left + b.width/2) + 'px';
  s.style.top = (b.top - st.top) + 'px';
  $('stage').appendChild(s);
  setTimeout(()=>s.remove(), 1200);
}

function say(text, tone){
  const b = $('bubble');
  b.textContent = text;
  b.className = 'bubble' + (tone ? ' ' + tone : '');
}

function drawBasket(){
  $('basket').innerHTML = basket.slice(-8).map(e=>'<span>'+e+'</span>').join('');
  $('basketLabel').textContent = T.basket + ' · ' + basket.length;
}

function render(){
  const r = ROUNDS[idx];
  picked = [];
  locked = false;
  $('counter').innerHTML = '<i>★</i> ' + T.level + ' ' + r.lv + ' · ' + (idx+1) + '/' + ROUNDS.length;
  $('askNative').textContent = askText(r);
  $('askEn').textContent = EN[r.ask];
  say(askText(r));

  const tray = $('tray');
  tray.innerHTML = '';
  r.items.forEach((it,i)=>{
    const card = document.createElement('button');
    card.className = 'card';
    card.dataset.i = i;
    if (it.n != null) {
      card.innerHTML = '<div class="cluster">' + Array.from({length:it.n}, ()=>'<span>'+it.e+'</span>').join('') + '</div>';
    } else {
      card.innerHTML = '<span class="glyph" style="font-size:calc(var(--k) * ' + (11*it.s).toFixed(2) + 'cqw)">' + it.e + '</span>';
    }
    card.onclick = ()=>tap(card, i);
    tray.appendChild(card);
  });

  const slots = $('slots');
  if (r.ask === 'order') {
    slots.hidden = false;
    slots.innerHTML = r.items.map((_,i)=> (i ? '<div class="arrow">→</div>' : '') + '<div class="slot" data-s="'+i+'">'+(i+1)+'</div>').join('');
  } else {
    slots.hidden = true;
  }
  drawBasket();
}

function collect(card, emoji){
  card.classList.add('right');
  sparkle(card);
  setTimeout(()=>{
    card.classList.add('gone');
    basket.push(emoji);
    drawBasket();
  }, 320);
}

function wrong(card){
  card.classList.add('no');
  say(T.oops, 'oops');
  speak(T.oops);
  setTimeout(()=>card.classList.remove('no'), 400);
}

function tap(card, i){
  if (locked) return;
  const r = ROUNDS[idx];
  if (r.ask === 'order') {
    const remaining = r.items.map((it,j)=>j).filter(j=>picked.indexOf(j) < 0);
    let nextJ = remaining[0];
    remaining.forEach(j=>{ if (val(r.items[j]) < val(r.items[nextJ])) nextJ = j; });
    if (i !== nextJ) return wrong(card);
    picked.push(i);
    const slot = $('slots').querySelector('.slot[data-s="' + (picked.length-1) + '"]');
    slot.textContent = r.items[i].e;
    slot.classList.add('filled');
    collect(card, r.items[i].e);
    if (picked.length === r.items.length) finishRound();
    return;
  }
  if (i !== answerIndex(r)) return wrong(card);
  locked = true;
  const it = r.items[i];
  collect(card, it.e);
  if (it.n != null) for (let k = 1; k < it.n; k++) basket.push(it.e);
  finishRound();
}

function finishRound(){
  locked = true;
  const praise = T.praise[idx % T.praise.length];
  say(praise, 'good');
  speak(praise.replace(/[^\p{L}\p{M}\s!।]/gu, ''));
  setTimeout(()=>{
    const nextR = ROUNDS[idx+1];
    if (!nextR) return showSheet('🌟', T.doneTitle, T.doneText, T.again, restart);
    if (nextR.lv !== ROUNDS[idx].lv) {
      return showSheet('🧺', T.lvlUp, T.level + ' ' + nextR.lv + ' — ' + LEVEL_EN[nextR.lv], T.go, ()=>{ idx++; hideSheet(); render(); });
    }
    idx++; render();
  }, 1100);
}

function showSheet(icon, title, text, btn, fn){
  $('sheetIcon').textContent = icon;
  $('sheetTitle').textContent = title;
  $('sheetText').textContent = text;
  $('sheetBtn').textContent = btn;
  $('sheetBtn').onclick = fn;
  $('veil').hidden = false;
}
function hideSheet(){ $('veil').hidden = true; }
function restart(){ idx = 0; basket = []; hideSheet(); render(); }

$('speak').onclick = ()=>speak($('bubble').textContent);
$('back').onclick = ()=>{
  try { parent.postMessage({ type:'bk-back' }, '*'); } catch(e){}
  history.length > 1 ? history.back() : null;
};

say(T.hello);
render();
</script>
</body>
</html>
