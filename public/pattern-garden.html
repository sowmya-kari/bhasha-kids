<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Vani's Magic Pattern Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;height:100%;background:#dff0f8;font-family:'Quicksand',sans-serif;color:#3a2a6b;overflow:hidden;}
  .fit{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  .stage{position:relative;width:min(100%, calc(100vh * 1.5));aspect-ratio:3/2;container-type:inline-size;
    background:url('assets/images/pattern-garden-bg.png') center/cover no-repeat;}

  /* live level counter over the baked badge */
  .counter{position:absolute;left:86.2%;top:2.4%;width:11.6%;height:7.4%;border-radius:99px;background:#fdfbff;
    border:.22cqw solid #e0d5f7;display:flex;align-items:center;justify-content:center;gap:.6cqw;
    font-family:'Baloo 2',cursive;font-weight:800;font-size:2.3cqw;color:#5b3fae;box-shadow:0 .4cqw 1cqw rgba(90,60,140,.14);}
  .counter svg{width:3.4cqw;height:3.4cqw;}

  /* pattern strip, laid over the baked cream panel */
  .panel{position:absolute;left:31.9%;top:37.8%;width:46.2%;height:25.4%;border-radius:3.2cqw;background:#fdf9ec;
    display:flex;align-items:center;justify-content:center;gap:1.2cqw;padding:0 1.6cqw;}
  .cell{width:7cqw;height:9.4cqw;display:flex;align-items:flex-end;justify-content:center;}
  .cell svg{width:100%;height:100%;display:block;overflow:visible;}
  .cell.sm svg{width:62%;height:62%;}
  .slot{width:8.4cqw;height:9.6cqw;border-radius:1.6cqw;border:.32cqw dashed #b9a7e6;background:rgba(255,255,255,.55);
    display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-weight:800;font-size:4.4cqw;color:#7c5fd0;}
  .slot.filled{border-style:solid;border-color:#5fc48d;background:#fff;font-size:0;padding:.5cqw;animation:pop .45s cubic-bezier(.3,1.6,.5,1);}
  .slot.filled svg{width:100%;height:100%;display:block;}
  .slot.miss{animation:shake .35s;border-color:#ef9aa8;}
  @keyframes pop{0%{transform:scale(.4);}70%{transform:scale(1.12);}100%{transform:scale(1);}}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-.7cqw);}75%{transform:translateX(.7cqw);}}

  /* three choice cards over the baked ones */
  .choices{position:absolute;left:30.4%;top:68.2%;width:43.4%;height:18.2%;display:flex;align-items:stretch;justify-content:space-between;}
  .choice{width:12.4cqw;border-radius:2.6cqw;background:#fdfcff;border:.3cqw solid #ddd2f4;
    box-shadow:0 .55cqw 0 #ded3f5, 0 1cqw 1.6cqw rgba(90,60,140,.12);cursor:pointer;padding:1.2cqw;
    display:flex;align-items:center;justify-content:center;transition:transform .1s;}
  .choice svg{width:100%;height:100%;display:block;}
  .choice.sm svg{width:60%;height:60%;}
  .slot.filled.sm svg{width:4.34cqw;height:5.83cqw;flex:none;}
  .choice:active{transform:translateY(.4cqw);box-shadow:0 .15cqw 0 #ded3f5;}
  .choice.right{border-color:#5fc48d;background:#f0fbf4;box-shadow:0 .55cqw 0 #bfe9cf;}
  .choice.no{border-color:#ef9aa8;background:#fdf1f3;box-shadow:0 .55cqw 0 #f6cdd4;}
  .choice[disabled]{cursor:default;}

  /* Vani's line, tucked under her in the artwork */
  .bubble{position:absolute;left:2.2%;bottom:3.4%;max-width:29%;padding:1.5cqw 2cqw;border-radius:2.4cqw 2.4cqw 2.4cqw .7cqw;
    background:rgba(255,255,255,.93);border:.24cqw solid #e6dcf6;box-shadow:0 .7cqw 1.6cqw rgba(70,50,20,.16);
    font-family:'Baloo 2',cursive;font-weight:700;font-size:2cqw;line-height:1.3;color:#4b3fb0;}
  .bubble.good{background:rgba(233,250,240,.95);border-color:#bfe9cf;color:#1b8c56;}
  .speak{position:absolute;left:2.2%;bottom:3.4%;transform:translate(0,-140%);background:#fdfbff;border:.24cqw solid #e0d5f7;
    width:5.4cqw;height:5.4cqw;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 .4cqw 1cqw rgba(90,60,140,.16);}
  .speak svg{width:2.8cqw;height:2.8cqw;}
  .speak:active{transform:translate(0,-140%) scale(.92);}

  .spark{position:absolute;width:2.4cqw;height:2.4cqw;pointer-events:none;z-index:6;animation:floatUp 1.1s ease-out forwards;}
  @keyframes floatUp{0%{opacity:0;transform:translateY(1cqw) scale(.4) rotate(0);}25%{opacity:1;}100%{opacity:0;transform:translateY(-7cqw) scale(1.1) rotate(140deg);}}

  .veil{position:absolute;inset:0;z-index:8;background:rgba(74,45,120,.42);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;}
  .veil[hidden]{display:none;}
  .band{display:none;}
  .back{position:absolute;left:2.1cqw;top:2.1cqw;width:4.6cqw;height:4.6cqw;border-radius:50%;border:0;
    background:transparent;cursor:pointer;z-index:7;}
  .back:active{transform:scale(.92);}

  /* ---- portrait (phone) composition: cropped title band, own panel + big cards ---- */
  html.portrait,html.portrait body{overflow:auto;}
  html.portrait .fit{align-items:flex-start;}
  html.portrait .stage{width:100%;aspect-ratio:auto;min-height:100%;background:none;
    display:flex;flex-direction:column;gap:2cqw;padding-bottom:5cqw;}
  html.portrait .stage::before{content:'';position:absolute;inset:0;z-index:0;
    background:#eaf5ea url('assets/images/pattern-garden-bg.png') center bottom/auto 160% no-repeat;}
  html.portrait .stage::after{content:'';position:absolute;inset:0;z-index:0;
    background:linear-gradient(rgba(255,255,255,.86) 0 22%,rgba(255,255,255,.6));}
  html.portrait .stage > *{position:relative;z-index:1;}
  html.portrait .band{display:block;width:100%;aspect-ratio:1536/318;
    background:url('assets/images/pattern-garden-bg.png') top center/100% auto no-repeat;}
  html.portrait .counter{position:static;align-self:flex-end;width:auto;height:auto;white-space:nowrap;
    margin:-1cqw 3.5cqw 0 0;padding:1.4cqw 3.4cqw;font-size:4.6cqw;}
  html.portrait .counter svg{width:7cqw;height:7cqw;}
  html.portrait .panel{position:static;width:94%;height:auto;margin:1cqw auto 0;padding:3cqw 2cqw;border-radius:6cqw;
    background:rgba(253,249,236,.96);box-shadow:0 1.6cqw 4cqw rgba(80,70,30,.18);gap:1.6cqw;}
  html.portrait .cell{width:14cqw;height:18cqw;}
  html.portrait .slot.filled.sm svg{width:8.68cqw;height:11.16cqw;}
  html.portrait .slot{width:17cqw;height:19cqw;border-radius:4cqw;font-size:9cqw;border-width:.8cqw;}
  html.portrait .choices{position:static;width:94%;height:auto;margin:2cqw auto 0;justify-content:center;gap:4cqw;}
  html.portrait .choice{width:25cqw;height:25cqw;border-radius:6cqw;padding:3cqw;border-width:.6cqw;
    box-shadow:0 1.2cqw 0 #ded3f5, 0 2cqw 3cqw rgba(90,60,140,.14);}
  html.portrait .bubble{position:static;max-width:94%;margin:3cqw auto 0;font-size:4.4cqw;padding:3.4cqw 4cqw;
    border-radius:5cqw 5cqw 5cqw 1.4cqw;border-width:.5cqw;}
  html.portrait .speak{position:static;transform:none;width:12cqw;height:12cqw;margin:2cqw auto 0;border-width:.5cqw;}
  html.portrait .speak:active{transform:scale(.92);}
  html.portrait .speak svg{width:6cqw;height:6cqw;}
  html.portrait .sheet{max-width:84%;border-radius:8cqw;padding:7cqw 6cqw;}
  html.portrait .sheet svg{width:20cqw;height:20cqw;}
  html.portrait .sheet h2{font-size:7cqw;}
  html.portrait .sheet p{font-size:4.2cqw;}
  html.portrait .next{font-size:5cqw;padding:3.4cqw 7cqw;box-shadow:0 1.2cqw 0 #4b3fb0;}
  html.portrait .spark{width:5cqw;height:5cqw;}
  .sheet{background:#fffdf6;border-radius:4cqw;padding:3.4cqw 4cqw;text-align:center;max-width:52%;
    box-shadow:0 2cqw 4cqw rgba(50,30,80,.3);border:.3cqw solid #f0e4c4;}
  .sheet svg{width:9cqw;height:9cqw;}
  .sheet h2{font-family:'Baloo 2',cursive;font-size:3.4cqw;margin:.6cqw 0 .4cqw;color:#5b3fae;}
  .sheet p{margin:0 0 1.8cqw;font-weight:700;font-size:1.9cqw;line-height:1.4;color:#6d768b;}
  .next{background:#6c5ce7;color:#fff;border:none;border-radius:99px;padding:1.5cqw 3.4cqw;font-family:'Baloo 2',cursive;
    font-weight:800;font-size:2.3cqw;cursor:pointer;box-shadow:0 .55cqw 0 #4b3fb0;}
  .next:active{transform:translateY(.4cqw);box-shadow:0 .15cqw 0 #4b3fb0;}
</style>
</head>
<body>
<div class="fit">
  <div class="stage" id="stage">
    <div class="band"></div>
    <button class="back" id="back" aria-label="Back"></button>
    <div class="counter" id="counter"></div>
    <div class="panel" id="panel"></div>
    <div class="choices" id="choices"></div>
    <button class="speak" id="speak" aria-label="Hear Vani">
      <svg viewBox="0 0 24 24" fill="none" stroke="#5b3fae" stroke-width="2.2" stroke-linecap="round"><path d="M4 9h3l4-3v12l-4-3H4z" fill="#5b3fae" stroke="none"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.5 7.5 0 0 1 0 10.4"/></svg>
    </button>
    <div class="bubble" id="bubble">Can you finish my magic pattern? ✨</div>
    <div class="veil" id="veil" hidden></div>
  </div>
</div>

<script>
if(new URLSearchParams(location.search).has('portrait')) document.documentElement.classList.add('portrait');
/* placeholder vector tokens, drawn to match the garden artwork */
const ART = {
  flower:`<svg viewBox="0 0 60 80"><path d="M30 78V44" stroke="#4aa84f" stroke-width="4.6" stroke-linecap="round"/><path d="M30 60c-9 1-13-4-14-9 7-2 12 2 14 9z" fill="#5cba58"/><path d="M30 66c9 1 13-3 14-8-7-2-12 1-14 8z" fill="#4aa84f"/><g fill="#f0679a"><ellipse cx="30" cy="16" rx="8" ry="10"/><ellipse cx="45" cy="27" rx="8" ry="10" transform="rotate(72 45 27)"/><ellipse cx="39" cy="44" rx="8" ry="10" transform="rotate(144 39 44)"/><ellipse cx="21" cy="44" rx="8" ry="10" transform="rotate(216 21 44)"/><ellipse cx="15" cy="27" rx="8" ry="10" transform="rotate(288 15 27)"/></g><circle cx="30" cy="30" r="7" fill="#f7c93f"/></svg>`,
  daisy:`<svg viewBox="0 0 60 80"><path d="M30 78V44" stroke="#4aa84f" stroke-width="4.6" stroke-linecap="round"/><path d="M30 60c-9 1-13-4-14-9 7-2 12 2 14 9z" fill="#5cba58"/><path d="M30 66c9 1 13-3 14-8-7-2-12 1-14 8z" fill="#4aa84f"/><g fill="#f7c93f"><ellipse cx="30" cy="15" rx="5.4" ry="9.6"/><ellipse cx="30" cy="45" rx="5.4" ry="9.6"/><ellipse cx="15" cy="30" rx="9.6" ry="5.4"/><ellipse cx="45" cy="30" rx="9.6" ry="5.4"/><ellipse cx="19.5" cy="19.5" rx="9.2" ry="5" transform="rotate(-45 19.5 19.5)"/><ellipse cx="40.5" cy="40.5" rx="9.2" ry="5" transform="rotate(-45 40.5 40.5)"/><ellipse cx="40.5" cy="19.5" rx="9.2" ry="5" transform="rotate(45 40.5 19.5)"/><ellipse cx="19.5" cy="40.5" rx="9.2" ry="5" transform="rotate(45 19.5 40.5)"/></g><circle cx="30" cy="30" r="7.4" fill="#e08a2a"/></svg>`,
  tulip:`<svg viewBox="0 0 60 80"><path d="M30 78V46" stroke="#4aa84f" stroke-width="4.6" stroke-linecap="round"/><path d="M30 62c-9 1-13-4-14-9 7-2 12 2 14 9z" fill="#5cba58"/><path d="M30 68c9 1 13-3 14-8-7-2-12 1-14 8z" fill="#4aa84f"/><path d="M15 21c0-3 1-6 3-7 2 4 4 6 6 6-1-5 2-9 6-11 4 2 7 6 6 11 2 0 4-2 6-6 2 1 3 4 3 7 0 13-6 23-15 23S15 34 15 21z" fill="#a06fd8"/><path d="M30 9c-2 4-3 9-3 14" stroke="#b98ee4" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>`,
  apple:`<svg viewBox="0 0 60 80"><path d="M31 30c0-7 3-12 9-14-1 7-4 12-9 14z" fill="#5cba58"/><path d="M30 26c1-6 0-9-2-12" stroke="#8a6234" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M30 28c12 0 20 9 20 22s-9 24-20 24S10 63 10 50s8-22 20-22z" fill="#ec5a63"/><path d="M22 38c-3 2-5 6-5 10" stroke="#fff" stroke-opacity=".5" stroke-width="3.4" stroke-linecap="round" fill="none"/></svg>`,
  orange:`<svg viewBox="0 0 60 80"><path d="M32 28c0-6 3-10 8-12-1 6-3 10-8 12z" fill="#5cba58"/><path d="M30 26v-8" stroke="#8a6234" stroke-width="4" stroke-linecap="round"/><circle cx="30" cy="52" r="22" fill="#f59125"/><circle cx="30" cy="52" r="22" fill="none" stroke="#dd7a12" stroke-width="2"/><path d="M22 38c-3 3-5 7-5 11" stroke="#fff" stroke-opacity=".45" stroke-width="3.4" stroke-linecap="round" fill="none"/></svg>`,
  butterfly:`<svg viewBox="0 0 60 80"><path d="M30 26v34" stroke="#6b4fb8" stroke-width="4.6" stroke-linecap="round"/><path d="M30 26l-5-8M30 26l5-8" stroke="#6b4fb8" stroke-width="3" stroke-linecap="round"/><path d="M28 32c-4-12-14-16-19-11s2 17 12 19c-8 4-10 13-5 16s11-4 12-14z" fill="#f4a03c"/><path d="M32 32c4-12 14-16 19-11s-2 17-12 19c8 4 10 13 5 16s-11-4-12-14z" fill="#b57ce0"/><circle cx="19" cy="31" r="3" fill="#fff0c4"/><circle cx="41" cy="31" r="3" fill="#fff0c4"/></svg>`,
  leaf:`<svg viewBox="0 0 60 80"><path d="M30 76c0-16 0-26-2-34" stroke="#3a8c48" stroke-width="4.5" stroke-linecap="round" fill="none"/><path d="M28 42C14 40 8 28 12 14c16 0 26 10 26 26 0 5-4 3-10 2z" fill="#5cba58"/><path d="M14 17c8 3 16 11 20 21" stroke="#3a8c48" stroke-width="2.4" fill="none"/></svg>`,
  star:`<svg viewBox="0 0 60 80"><path d="M30 14l6.6 14.3 15.4 1.9-11.3 10.7 2.9 15.4L30 49l-13.6 7.3 2.9-15.4L8 30.2l15.4-1.9z" fill="#f7c93f" stroke="#e0a41c" stroke-width="2.2" stroke-linejoin="round"/></svg>`,
  circle:`<svg viewBox="0 0 60 80"><circle cx="30" cy="44" r="21" fill="#5aa9e6" stroke="#3b88c6" stroke-width="2.4"/></svg>`,
  disc:`<svg viewBox="0 0 60 80"><circle cx="30" cy="44" r="21" fill="#f7c93f" stroke="#e0a41c" stroke-width="2.4"/></svg>`,
  triangle:`<svg viewBox="0 0 60 80"><path d="M30 22l20 40H10z" fill="#ef6f8c" stroke="#d24e6d" stroke-width="2.4" stroke-linejoin="round"/></svg>`,
  bee:`<svg viewBox="0 0 60 80"><path d="M14 30c-5-6-9-6-11-3 2 4 6 6 11 3zM46 30c5-6 9-6 11-3-2 4-6 6-11 3z" fill="#dceefa" stroke="#a9cee4" stroke-width="1.6"/><ellipse cx="30" cy="46" rx="17" ry="14" fill="#f7c93f"/><path d="M24 34c-1 8-1 16 0 24M33 33c-1 9-1 17 0 26" stroke="#3a3423" stroke-width="5.5" stroke-linecap="round"/><ellipse cx="30" cy="46" rx="17" ry="14" fill="none" stroke="#e0a41c" stroke-width="2"/><circle cx="19" cy="41" r="2.4" fill="#3a3423"/><path d="M30 30l-3-7M34 30l4-7" stroke="#3a3423" stroke-width="2.4" stroke-linecap="round"/></svg>`,
  square:`<svg viewBox="0 0 60 80"><rect x="11" y="25" width="38" height="38" rx="5" fill="#7ccf7a" stroke="#4aa84f" stroke-width="2.4"/></svg>`,
  heart:`<svg viewBox="0 0 60 80"><path d="M30 64C12 51 7 41 9 32c2-9 13-12 21-3 8-9 19-6 21 3 2 9-3 19-21 32z" fill="#f58bb0" stroke="#d85b88" stroke-width="2.4" stroke-linejoin="round"/></svg>`,
  mushroom:`<svg viewBox="0 0 60 80"><path d="M23 48h14v20a7 7 0 0 1-14 0z" fill="#f6ead3" stroke="#d8c5a4" stroke-width="2"/><path d="M8 48c0-13 10-22 22-22s22 9 22 22z" fill="#ef6f8c"/><circle cx="20" cy="38" r="4" fill="#fff8e7"/><circle cx="36" cy="34" r="3.2" fill="#fff8e7"/><circle cx="43" cy="43" r="2.6" fill="#fff8e7"/></svg>`,
};
const SPARK = `<svg viewBox="0 0 24 24" fill="#f7c93f"><path d="M12 0l2.6 8.4L23 11l-8.4 2.6L12 22l-2.6-8.4L1 11l8.4-2.6z"/></svg>`;

const GARDENS = [
  {name:'Flower Garden', icon:ART.flower},
  {name:'Butterfly Garden', icon:ART.butterfly},
  {name:'Rainbow Garden', icon:ART.star},
];
const LEVELS = [
  {g:0, seq:['flower','daisy','flower','daisy'], answer:'flower', choices:['flower','tulip','daisy']},
  {g:0, seq:['tulip','tulip','daisy','tulip','tulip'], answer:'daisy', choices:['tulip','daisy','apple']},
  {g:0, seq:['apple','apple','orange','apple','apple'], answer:'orange', choices:['apple','orange','mushroom']},
  {g:0, seq:['apple','orange','mushroom','apple','orange'], answer:'mushroom', choices:['orange','mushroom','apple']},
  {g:0, seq:['apple:sm','apple','apple:sm','apple'], answer:'apple:sm', choices:['apple','apple:sm','orange']},
  {g:1, seq:['bee','butterfly','bee','butterfly'], answer:'bee', choices:['butterfly','leaf','bee']},
  {g:1, seq:['butterfly','flower','leaf','butterfly','flower'], answer:'leaf', choices:['leaf','butterfly','flower']},
  {g:1, seq:['leaf','leaf','butterfly','leaf','leaf'], answer:'butterfly', choices:['leaf','butterfly','bee']},
  {g:1, seq:['star:sm','star','star:sm','star'], answer:'star:sm', choices:['star:sm','star','disc']},
  {g:1, seq:['butterfly:sm','butterfly:sm','butterfly','butterfly:sm','butterfly:sm'], answer:'butterfly', choices:['butterfly:sm','butterfly','bee']},
  {g:2, seq:['square','circle','square','circle'], answer:'square', choices:['circle','triangle','square']},
  {g:2, seq:['circle','disc','triangle','circle','disc'], answer:'triangle', choices:['triangle','circle','disc']},
  {g:2, seq:['heart','star','disc','heart','star'], answer:'disc', choices:['heart','disc','star']},
  {g:2, seq:['triangle','triangle','heart','heart','triangle'], answer:'triangle', choices:['heart','triangle','square']},
  {g:2, seq:['flower','bee','flower','butterfly','flower'], answer:'bee', choices:['bee','butterfly','leaf']},
  {g:2, seq:['star','star:sm','star:sm','star','star:sm'], answer:'star:sm', choices:['star','star:sm','heart']},
];
const PRAISE = ['Beautiful! You found the pattern!','Look at it bloom! Wonderful.','Magic! The garden is so happy.','You saw it before I did!','Perfect — sparkles everywhere!'];
const NUDGE = ['Almost! Look at the one just before the question mark.','Try again, little gardener. Say the pattern with me.','Not that one — but you are very close.'];
const ASK = 'Can you finish my magic pattern? ✨';

let li = 0, solved = 0, locked = false;
const $ = id => document.getElementById(id);
const art = tok => { const [n, s] = tok.split(':'); return {svg: ART[n] || ART.flower, sm: s === 'sm'}; };

function say(text, good){
  const b = $('bubble');
  b.textContent = text;
  b.className = 'bubble' + (good ? ' good' : '');
}
function speak(){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance($('bubble').textContent);
    u.rate = .88; u.pitch = 1.25;
    speechSynthesis.speak(u);
  }catch(e){}
}
function sparkle(host, n){
  const r = host.getBoundingClientRect(), s = $('stage').getBoundingClientRect();
  for(let i = 0; i < n; i++){
    const el = document.createElement('div');
    el.className = 'spark'; el.innerHTML = SPARK;
    el.style.left = (r.left - s.left + Math.random() * r.width) + 'px';
    el.style.top = (r.top - s.top + r.height * .2 + Math.random() * r.height * .6) + 'px';
    el.style.animationDelay = (i * 60) + 'ms';
    $('stage').appendChild(el);
    setTimeout(() => el.remove(), 1500 + i * 60);
  }
}
function render(){
  const L = LEVELS[li];
  locked = false;
  say(ASK);
  $('counter').innerHTML = GARDENS[L.g].icon + '<span>' + (li + 1) + ' / ' + LEVELS.length + '</span>';
  $('panel').innerHTML = L.seq.map(t => {
    const a = art(t);
    return `<div class="cell${a.sm ? ' sm' : ''}">${a.svg}</div>`;
  }).join('') + '<div class="slot" id="slot">?</div>';
  $('choices').innerHTML = L.choices.map(c =>
    `<button class="choice${art(c).sm ? ' sm' : ''}" data-tok="${c}" aria-label="choice">${art(c).svg}</button>`).join('');
  [...$('choices').children].forEach(b => b.onclick = () => pick(b));
}
function pick(btn){
  if(locked) return;
  const L = LEVELS[li], tok = btn.dataset.tok, slot = $('slot');
  if(tok !== L.answer){
    btn.classList.add('no');
    slot.classList.add('miss');
    say(NUDGE[Math.floor(Math.random() * NUDGE.length)]);
    setTimeout(() => { btn.classList.remove('no'); slot.classList.remove('miss'); }, 620);
    return;
  }
  locked = true;
  btn.classList.add('right');
  const a = art(tok);
  slot.classList.add('filled');
  if(a.sm) slot.classList.add('sm');
  slot.innerHTML = a.svg;
  if(a.sm) slot.style.padding = '2cqw';
  say(PRAISE[Math.floor(Math.random() * PRAISE.length)], true);
  solved = Math.max(solved, li + 1);
  sparkle(slot, 7);
  [...$('choices').children].forEach(b => b.disabled = true);
  const newGarden = li + 1 < LEVELS.length && LEVELS[li + 1].g !== L.g;
  setTimeout(() => {
    if(li + 1 >= LEVELS.length) return sheet(ART.flower, 'The whole garden is blooming!',
      'You finished every magic pattern. Vani wants to plant more with you.', 'Play again', () => { li = 0; solved = 0; render(); });
    if(newGarden){
      const gi = LEVELS[li + 1].g;
      return sheet(GARDENS[gi].icon, GARDENS[gi].name + ' is open!',
        'Vani sprinkles magic dust and a new part of the garden blooms.', "Let's go ✨", () => { li++; render(); });
    }
    li++; render();
  }, 1350);
}
function sheet(icon, title, body, cta, onGo){
  const v = $('veil');
  v.innerHTML = `<div class="sheet">${icon}<h2>${title}</h2><p>${body}</p><button class="next" id="go">${cta}</button></div>`;
  v.hidden = false;
  sparkle(v.firstElementChild, 12);
  $('go').onclick = () => { v.hidden = true; onGo(); };
}
$('speak').onclick = speak;
$('back').onclick = () => { try{ parent.postMessage({bhashaKids:'back'}, '*'); }catch(e){} };
render();
</script>
