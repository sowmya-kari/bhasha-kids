<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Find It for Mithu! — Bhasha Kids</title>
<style>
  :root{
    --sky-top:#6EC6FF;
    --sky-bottom:#BFEFFF;
    --sun:#FFD447;
    --grass-1:#8FD14F;
    --grass-2:#6FBF3E;
    --card-bg:#FFFFFF;
    --card-shadow: rgba(30,70,50,0.25);
    --mithu-green:#3CB878;
    --mithu-green-dark:#2E9C63;
    --accent-orange:#FF9A3D;
    --accent-pink:#FF6FA5;
    --accent-purple:#8A6BFF;
    --text-dark:#2C3B33;
    --star-gold:#FFC93C;
    --star-empty:#E4E9E2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none;}
  html,body{height:100%; margin:0;}
  body{
    font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;
    overflow:hidden;
    background: linear-gradient(var(--sky-top), var(--sky-bottom) 55%, var(--grass-1) 55%, var(--grass-2) 100%);
    position:relative;
    touch-action: manipulation;
  }
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+Telugu:wght@600;800&family=Noto+Sans+Devanagari:wght@600;800&display=swap');

  #scene{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .sun{
    position:absolute; top:18px; right:24px; width:70px; height:70px;
    background:radial-gradient(circle at 35% 35%, #FFF3B0, var(--sun));
    border-radius:50%;
    box-shadow: 0 0 30px 10px rgba(255,212,71,0.55);
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }

  .cloud{
    position:absolute; background:#fff; border-radius:50px; opacity:0.9;
    box-shadow: 0 4px 0 rgba(255,255,255,0.6);
  }
  .cloud::before, .cloud::after{ content:""; position:absolute; background:#fff; border-radius:50%; }
  .cloud1{ top:60px; left:6%; width:90px; height:32px; }
  .cloud1::before{ width:50px; height:50px; top:-24px; left:10px; }
  .cloud1::after{ width:36px; height:36px; top:-16px; left:50px; }
  .cloud2{ top:30px; left:40%; width:70px; height:26px; animation: drift 22s linear infinite; }
  .cloud2::before{ width:40px; height:40px; top:-18px; left:8px; }
  .cloud2::after{ width:28px; height:28px; top:-12px; left:38px; }
  @keyframes drift{ 0%{transform:translateX(0);} 50%{transform:translateX(30px);} 100%{transform:translateX(0);} }

  .hill{ position:absolute; bottom:12vh; border-radius:50%; background: var(--grass-1); opacity:0.6; }
  .hill1{ width:220px; height:220px; left:-60px; bottom:8vh; background:#7FCB49; }
  .hill2{ width:260px; height:260px; right:-80px; bottom:6vh; background:#79C645; }

  .tree{ position:absolute; bottom:11vh; width:44px; }
  .tree .trunk{ width:10px; height:26px; background:#A9713C; margin:0 auto; border-radius:3px; }
  .tree .leaves{ width:52px; height:52px; background:#4FAE55; border-radius:50%; margin:-40px auto 0; box-shadow: 14px 6px 0 -6px #58BE5E, -14px 6px 0 -6px #58BE5E; }
  .treeL{ left:2%; transform: scale(0.85); }
  .treeR{ right:3%; transform: scale(1.05); }

  .flowerbed{ position:absolute; bottom:6.5vh; width:100%; display:flex; justify-content:space-around; pointer-events:none; }
  .flower{ font-size:20px; opacity:0.9; animation: sway 3s ease-in-out infinite; }
  .flower:nth-child(2n){ animation-delay:0.6s; }
  .flower:nth-child(3n){ animation-delay:1.2s; }
  @keyframes sway{ 0%,100%{ transform: rotate(-6deg);} 50%{ transform: rotate(6deg);} }

  #topbar{
    position:relative; z-index:5; width:100%; max-width:720px;
    display:flex; align-items:center; justify-content:space-between; padding: 16px 20px 0;
  }
  #progress-pill{ background:#fff; border-radius:999px; padding:8px 18px; font-weight:800; font-size:20px; color:var(--mithu-green-dark); box-shadow: 0 4px 0 var(--card-shadow); }
  #stars{ display:flex; gap:6px; background:#fff; border-radius:999px; padding:8px 14px; box-shadow: 0 4px 0 var(--card-shadow); }
  .star{ font-size:20px; color: var(--star-empty); transition: transform 0.3s, color 0.3s; }
  .star.filled{ color: var(--star-gold); transform: scale(1.15); }

  #category-chip{ z-index:5; margin-top:10px; background: var(--accent-purple); color:#fff; font-weight:700; font-size:14px; padding:6px 16px; border-radius:999px; box-shadow: 0 3px 0 rgba(0,0,0,0.15); }

  #mode-pill{ z-index:5; margin-top:8px; background:#fff8df; color:#8A5A00; font-weight:800; padding:6px 14px; border-radius:999px; box-shadow:0 3px 0 rgba(0,0,0,0.12); }
  #mode-pill.sound-mode{ background:#5B8DEF; color:#fff; }
  .surprise-banner{ background:#FF6FA5 !important; color:#fff !important; }

  #mithu-wrap{ position:relative; z-index:5; margin-top:6px; display:flex; flex-direction:column; align-items:center; }
  #mithu{ width:96px; height:96px; transform-origin:center bottom; }
  #mithu.happy{ animation: jump 0.6s ease-in-out 2; }
  #mithu.oops{ animation: shake 0.5s ease-in-out; }
  @keyframes jump{
    0%{ transform: translateY(0) rotate(0deg); }
    30%{ transform: translateY(-18px) rotate(-6deg); }
    55%{ transform: translateY(0) rotate(4deg); }
    75%{ transform: translateY(-8px) rotate(-2deg); }
    100%{ transform: translateY(0) rotate(0deg); }
  }
  @keyframes shake{
    0%,100%{ transform: translateX(0) rotate(0deg); }
    25%{ transform: translateX(-6px) rotate(-4deg); }
    75%{ transform: translateX(6px) rotate(4deg); }
  }
  .wing-left, .wing-right{ transform-origin: 60% 50%; }
  #mithu.happy .wing-left{ animation: flapL 0.3s ease-in-out 4; }
  #mithu.happy .wing-right{ animation: flapR 0.3s ease-in-out 4; }
  @keyframes flapL{ 0%,100%{ transform: rotate(0deg);} 50%{ transform: rotate(-35deg);} }
  @keyframes flapR{ 0%,100%{ transform: rotate(0deg);} 50%{ transform: rotate(35deg);} }

  #speech-bubble{ position:relative; margin-top:2px; background:#fff; border-radius:22px; padding:10px 20px 12px; box-shadow: 0 4px 0 var(--card-shadow); text-align:center; max-width:88vw; }
  #speech-bubble::before{ content:""; position:absolute; top:-10px; left:50%; transform:translateX(-50%); border-left:10px solid transparent; border-right:10px solid transparent; border-bottom:12px solid #fff; }
  #q-primary{ font-family:"Noto Sans Telugu","Noto Sans Devanagari",sans-serif; font-size:30px; font-weight:800; color:var(--text-dark); line-height:1.15; }
  #q-english{ font-size:14px; color:#7A8B7F; font-weight:600; margin-top:2px; }
  #replay-btn{ margin-top:6px; background:var(--accent-orange); border:none; color:#fff; width:38px; height:38px; border-radius:50%; font-size:18px; cursor:pointer; box-shadow: 0 3px 0 #C9701A; }
  #replay-btn:active{ transform: translateY(2px); box-shadow:none; }

  #cards{ z-index:5; margin-top:14px; display:flex; gap:16px; justify-content:center; align-items:stretch; padding: 0 14px; width:100%; max-width:760px; flex:1; }
  .card{
    position:relative; background: var(--card-bg); border-radius:28px; flex:1; max-width:210px; min-width:96px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 6px 14px;
    box-shadow: 0 8px 0 var(--card-shadow); cursor:pointer; transition: transform 0.15s ease; border: 5px solid transparent;
  }
  .card:active{ transform: translateY(4px); box-shadow: 0 4px 0 var(--card-shadow); }
  .card .emoji{ font-size:64px; line-height:1; filter: drop-shadow(0 4px 3px rgba(0,0,0,0.15)); transition: transform 0.35s; }
  .card .label{ margin-top:6px; font-family:"Noto Sans Telugu","Noto Sans Devanagari",sans-serif; font-size:16px; font-weight:700; color:var(--text-dark); text-align:center; }
  .card.correct{ border-color: #6FE07A; background: #EBFFEE; animation: correctPulse 0.5s ease; }
  .card.correct .emoji{ transform: scale(1.35); }
  @keyframes correctPulse{ 0%{ transform:scale(1);} 40%{ transform:scale(1.08);} 100%{ transform:scale(1);} }
  .card.wrong{ animation: wiggle 0.45s ease; }
  @keyframes wiggle{
    0%,100%{ transform: rotate(0deg) translateX(0); }
    20%{ transform: rotate(-4deg) translateX(-4px); }
    40%{ transform: rotate(4deg) translateX(4px); }
    60%{ transform: rotate(-3deg) translateX(-3px); }
    80%{ transform: rotate(3deg) translateX(3px); }
  }
  .card.dim{ opacity:0.55; }
  .card.dragging{ transform:scale(1.05); box-shadow:0 14px 0 rgba(30,70,50,.18); }
  .card.feeding{ animation: flyToBasket 0.5s ease forwards; }
  @keyframes flyToBasket{
    0%{ transform: translateY(0) scale(1); }
    60%{ transform: translateY(-40px) scale(0.7) rotate(10deg); }
    100%{ transform: translateY(-70px) scale(0.3) rotate(20deg); opacity:0.2; }
  }

  .sparkle{ position:absolute; pointer-events:none; font-size:20px; animation: sparkleUp 0.8s ease-out forwards; }
  @keyframes sparkleUp{
    0%{ transform: translateY(0) scale(0.4) rotate(0deg); opacity:1; }
    100%{ transform: translateY(-70px) scale(1.1) rotate(90deg); opacity:0; }
  }

  #drop-zone{
    display:none; z-index:6; margin:8px auto 0; min-width:210px; padding:12px 18px;
    border-radius:22px; border:4px dashed #FFB24D; background:#FFF7DF; color:#7A5318;
    font-weight:800; text-align:center; box-shadow:0 5px 0 rgba(0,0,0,.12);
  }
  #drop-zone.show{ display:block; }
  #drop-zone .drop-emoji{ font-size:42px; display:block; }

  #toast{
    position:absolute; left:50%; top:38%; transform:translate(-50%,-50%) scale(0.6);
    z-index:20; background:#fff; border-radius:24px; padding:16px 28px;
    font-size:26px; font-weight:800; color:var(--mithu-green-dark);
    box-shadow: 0 10px 0 var(--card-shadow); opacity:0; pointer-events:none; text-align:center;
  }
  #toast.show{ animation: toastPop 1.1s ease forwards; }
  @keyframes toastPop{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(0.5); }
    20%{ opacity:1; transform:translate(-50%,-50%) scale(1.08); }
    30%{ transform:translate(-50%,-50%) scale(1); }
    80%{ opacity:1; }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(1); }
  }

  #start-screen{
    position:absolute; inset:0; z-index:30;
    background: linear-gradient(var(--sky-top), var(--sky-bottom) 60%, var(--grass-1) 60%, var(--grass-2) 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center;
  }
  #start-screen h1{ font-size:34px; color:#fff; text-shadow: 0 3px 0 rgba(0,0,0,0.15); margin:6px 0 2px; }
  #start-screen .sub{ color:#fff; opacity:0.9; font-weight:600; margin-bottom:18px; }
  #big-mithu{ width:150px; height:150px; }
  #cat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:520px; width:100%; }
  .cat-btn{ background:#fff; border:none; border-radius:20px; padding:14px 6px; font-family:"Baloo 2",sans-serif; font-weight:800; font-size:14px; color:var(--text-dark); box-shadow: 0 5px 0 var(--card-shadow); cursor:pointer; }
  .cat-btn .cat-emoji{ font-size:30px; display:block; margin-bottom:4px; }
  .cat-btn:active{ transform:translateY(3px); box-shadow:none; }
  .cat-btn.mixed{ background: var(--accent-pink); color:#fff; grid-column: span 3; }

  #finish-screen{
    position:absolute; inset:0; z-index:30; display:none;
    align-items:center; justify-content:center; flex-direction:column;
    background: linear-gradient(var(--sky-top), var(--sky-bottom) 60%, var(--grass-1) 60%, var(--grass-2) 100%);
    text-align:center; padding:20px;
  }
  #finish-screen h1{ font-size:32px; color:#fff; text-shadow:0 3px 0 rgba(0,0,0,0.15); margin-bottom:4px; }
  #finish-stars{ font-size:38px; color:var(--star-gold); text-shadow:0 2px 0 rgba(0,0,0,0.1); letter-spacing:4px; }
  #finish-sub{ color:#fff; font-weight:700; opacity:0.95; margin-top:4px; }
  #play-again{
    margin-top:18px; background:var(--accent-orange); color:#fff; border:none;
    font-family:"Baloo 2",sans-serif; font-weight:800; font-size:18px;
    padding:14px 30px; border-radius:999px; box-shadow:0 5px 0 #C9701A; cursor:pointer;
  }
  #play-again:active{ transform:translateY(3px); box-shadow:none; }

  @media (max-width:420px){
    #q-primary{ font-size:24px; }
    .card .emoji{ font-size:52px; }
    #mithu{ width:78px; height:78px; }
  }
</style>
</head>
<body>
<div id="scene">
  <div class="sun"></div>
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="hill hill1"></div>
  <div class="hill hill2"></div>
  <div class="tree treeL"><div class="leaves"></div><div class="trunk"></div></div>
  <div class="tree treeR"><div class="leaves"></div><div class="trunk"></div></div>
  <div class="flowerbed" id="flowerbed"></div>

  <div id="start-screen">
    <svg id="big-mithu" viewBox="0 0 120 120"><use href="#mithu-svg"/></svg>
    <h1>మిత్తుతో వెతకండి!</h1>
    <div class="sub">Find It for Mithu! · Tap a category to play</div>
    <div id="cat-grid"></div>
  </div>

  <div id="finish-screen">
    <svg width="150" height="150" viewBox="0 0 120 120"><use href="#mithu-svg"/></svg>
    <h1>అదిరింది! 🎉</h1>
    <div id="finish-stars"></div>
    <div id="finish-sub">Great playing!</div>
    <button id="play-again">Play Again</button>
  </div>

  <div id="topbar">
    <div id="progress-pill">1/5</div>
    <div id="stars">
      <span class="star" data-i="0">★</span>
      <span class="star" data-i="1">★</span>
      <span class="star" data-i="2">★</span>
    </div>
  </div>
  <div id="category-chip">Fruits</div>
  <div id="mode-pill">1 · TAP IT</div>

  <div id="mithu-wrap">
    <svg id="mithu" viewBox="0 0 120 120">
      <use href="#mithu-svg"/>
    </svg>
    <div id="speech-bubble">
      <div id="q-primary">మామిడి ఎక్కడ?</div>
      <div id="q-english">Where is the mango?</div>
      <button id="replay-btn" aria-label="Play sound again">🔊</button>
    </div>
  </div>

  <div id="cards"></div>
  <div id="drop-zone"><span class="drop-emoji">🧺</span><span id="drop-label">Bring it here!</span></div>
  <div id="toast"></div>
</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="mithu-svg">
      <ellipse cx="60" cy="100" rx="20" ry="6" fill="#000" opacity="0.08"/>
      <path d="M55 78 Q40 100 30 112 Q46 108 56 92 Z" fill="#2E9C63"/>
      <path d="M62 80 Q60 104 54 116 Q68 108 68 90 Z" fill="#3CB878"/>
      <ellipse cx="62" cy="66" rx="34" ry="36" fill="#3CB878"/>
      <ellipse cx="62" cy="70" rx="22" ry="24" fill="#F4D35E"/>
      <path class="wing-right" d="M88 50 Q112 58 106 84 Q90 82 82 62 Z" fill="#FF9A3D"/>
      <path class="wing-right" d="M88 50 Q104 56 100 74 Q88 74 84 60 Z" fill="#FF6FA5" opacity="0.85"/>
      <path class="wing-left" d="M36 50 Q12 58 18 84 Q34 82 42 62 Z" fill="#2E9C63"/>
      <circle cx="62" cy="34" r="26" fill="#3CB878"/>
      <circle cx="62" cy="30" r="18" fill="#4FCB8A"/>
      <circle cx="70" cy="30" r="11" fill="#fff"/>
      <circle cx="72" cy="31" r="6" fill="#2C3B33"/>
      <circle cx="74" cy="29" r="2" fill="#fff"/>
      <path d="M48 32 Q34 34 36 44 Q46 46 52 38 Z" fill="#FF9A3D"/>
      <path d="M36 44 Q40 50 50 46 Z" fill="#C9701A"/>
      <path d="M50 12 Q52 2 58 10 Z" fill="#FF6FA5"/>
      <path d="M60 8 Q62 -2 68 8 Z" fill="#8A6BFF"/>
      <path d="M70 12 Q74 4 78 14 Z" fill="#FFD447"/>
      <path d="M50 96 l-4 10 M50 96 l4 10 M50 96 l0 11" stroke="#C9701A" stroke-width="3" stroke-linecap="round"/>
      <path d="M74 96 l-4 10 M74 96 l4 10 M74 96 l0 11" stroke="#C9701A" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>
</svg>

<script>
(function(){
  const DATA = {
    fruits:    { emoji:"🍎", label:"పండ్లు",   items:[
      {en:"mango",   te:"మామిడి",       hi:"आम",     emoji:"🥭"},
      {en:"apple",   te:"ఆపిల్",        hi:"सेब",    emoji:"🍎"},
      {en:"banana",  te:"అరటిపండు",     hi:"केला",   emoji:"🍌"},
      {en:"grapes",  te:"ద్రాక్ష",       hi:"अंगूर",  emoji:"🍇"},
    ]},
    vegetables:{ emoji:"🥕", label:"కూరగాయలు", items:[
      {en:"carrot",  te:"క్యారెట్",     hi:"गाजर",   emoji:"🥕"},
      {en:"tomato",  te:"టమోటా",        hi:"टमाटर",  emoji:"🍅"},
      {en:"potato",  te:"బంగాళదుంప",    hi:"आलू",    emoji:"🥔"},
      {en:"corn",    te:"మొక్కజొన్న",    hi:"मक्का",  emoji:"🌽"},
    ]},
    animals:   { emoji:"🐶", label:"జంతువులు",  items:[
      {en:"dog",     te:"కుక్క",         hi:"कुत्ता",  emoji:"🐶"},
      {en:"cat",     te:"పిల్లి",        hi:"बिल्ली", emoji:"🐱"},
      {en:"cow",     te:"ఆవు",           hi:"गाय",    emoji:"🐄"},
      {en:"elephant",te:"ఏనుగు",         hi:"हाथी",   emoji:"🐘"},
    ]},
    toys:      { emoji:"⚽", label:"బొమ్మలు",    items:[
      {en:"ball",    te:"బంతి",          hi:"गेंद",   emoji:"⚽"},
      {en:"kite",    te:"గాలిపటం",       hi:"पतंग",   emoji:"🪁"},
      {en:"drum",    te:"డోలు",          hi:"ढोल",    emoji:"🥁"},
      {en:"top",     te:"తిరుగుడు బొంగరం", hi:"लट्टू", emoji:"🪀"},
    ]},
    home:      { emoji:"🪑", label:"ఇంటి వస్తువులు", items:[
      {en:"chair",   te:"కుర్చీ",        hi:"कुर्सी", emoji:"🪑"},
      {en:"cup",     te:"కప్పు",         hi:"कप",     emoji:"☕"},
      {en:"clock",   te:"గడియారం",       hi:"घड़ी",   emoji:"🕰️"},
      {en:"lamp",    te:"దీపం",          hi:"दीपक",   emoji:"💡"},
    ]},
    clothes:   { emoji:"👕", label:"బట్టలు",     items:[
      {en:"shirt",   te:"చొక్కా",        hi:"कमीज़",  emoji:"👕"},
      {en:"cap",     te:"టోపీ",          hi:"टोपी",   emoji:"🧢"},
      {en:"shoe",    te:"బూటు",          hi:"जूता",   emoji:"👟"},
      {en:"socks",   te:"సాక్సులు",       hi:"मोज़े",  emoji:"🧦"},
    ]},
    flowers:   { emoji:"🌸", label:"పువ్వులు",   items:[
      {en:"rose",     te:"గులాబీ",         hi:"गुलाब",     emoji:"🌹"},
      {en:"sunflower",te:"పొద్దుతిరుగుడు", hi:"सूरजमुखी", emoji:"🌻"},
      {en:"lotus",    te:"తామర",           hi:"कमल",       emoji:"🪷"},
      {en:"hibiscus", te:"మందారం",         hi:"गुड़हल",    emoji:"🌺"},
    ]},
    vehicles:  { emoji:"🚗", label:"వాహనాలు",   items:[
      {en:"car",     te:"కారు",          hi:"गाड़ी",  emoji:"🚗"},
      {en:"bus",     te:"బస్సు",         hi:"बस",     emoji:"🚌"},
      {en:"bicycle", te:"సైకిల్",         hi:"साइकिल", emoji:"🚲"},
      {en:"train",   te:"రైలు",          hi:"रेल",    emoji:"🚂"},
    ]},
  };
  const CATS = Object.keys(DATA);
  const TOTAL_ROUNDS = 5;
  const SPARKLE_EMOJIS = ["✨","⭐","🌟","💫"];
  const CELEBRATIONS_TE = ["భలే!","సూపర్!","చాలా బాగుంది!","అద్భుతం!"];
  const CELEBRATIONS_HI = ["शाबाश!","बहुत बढ़िया!","कमाल है!","वाह!"];
  const TRY_AGAIN_TE = "మళ్ళీ ప్రయత్నించు!";
  const TRY_AGAIN_HI = "फिर कोशिश करो!";

  let round = 0, correctCount = 0, activeCategory = "mixed", locked = false, currentLang = "te";
  let roundItem = null, wrongTries = 0, filledStars = 0;
  const MODE_SEQUENCE = ["tap","feed","sound","tap","surprise"];
  let currentMode = "tap";

  const el = id => document.getElementById(id);
  const cardsEl = el("cards"), qPrimary = el("q-primary"), qEnglish = el("q-english");
  const progressPill = el("progress-pill"), catChip = el("category-chip"), mithuEl = el("mithu");
  const toastEl = el("toast"), starsEls = document.querySelectorAll(".star");
  const startScreen = el("start-screen"), finishScreen = el("finish-screen");
  const modePill = el("mode-pill"), dropZone = el("drop-zone"), dropLabel = el("drop-label");
  const finishStars = el("finish-stars");

  const catGrid = el("cat-grid");
  CATS.forEach(key=>{
    const b = document.createElement("button");
    b.className = "cat-btn";
    b.innerHTML = `<span class="cat-emoji">${DATA[key].emoji}</span>${DATA[key].label}`;
    b.onclick = ()=> startGame(key);
    catGrid.appendChild(b);
  });
  const mixedBtn = document.createElement("button");
  mixedBtn.className = "cat-btn mixed";
  mixedBtn.innerHTML = `<span class="cat-emoji">🎲</span>Mixed · అన్నీ కలిపి`;
  mixedBtn.onclick = ()=> startGame("mixed");
  catGrid.appendChild(mixedBtn);

  const flowerEmojis = ["🌸","🌼","🌷","🌻"];
  for(let i=0;i<10;i++){
    const f = document.createElement("span");
    f.className = "flower";
    f.textContent = flowerEmojis[i % flowerEmojis.length];
    el("flowerbed").appendChild(f);
  }

  el("play-again").onclick = ()=>{ finishScreen.style.display = "none"; startScreen.style.display = "flex"; };

  function startGame(cat){
    activeCategory = cat;
    round = 0; correctCount = 0; filledStars = 0;
    starsEls.forEach(s=>s.classList.remove("filled"));
    startScreen.style.display = "none";
    finishScreen.style.display = "none";
    nextRound();
  }

  function pickPool(){
    if(activeCategory === "mixed"){ return CATS.flatMap(k=>DATA[k].items); }
    return DATA[activeCategory].items;
  }

  function nextRound(){
    if(round >= TOTAL_ROUNDS){ return finishGame(); }
    round++;
    wrongTries = 0;
    locked = false;
    progressPill.textContent = `${round}/${TOTAL_ROUNDS}`;
    catChip.textContent = activeCategory === "mixed" ? "Mixed · అన్నీ కలిపి" : DATA[activeCategory].label;
    currentLang = Math.random() < 0.5 ? "te" : "hi";
    currentMode = MODE_SEQUENCE[round-1] || "tap";

    const pool = pickPool();
    const shuffled = [...pool].sort(()=>Math.random()-0.5).slice(0,3);
    roundItem = shuffled[Math.floor(Math.random()*shuffled.length)];

    const modeNames = {tap:"TAP IT",feed:"FEED MITHU",sound:"SOUND HUNT",surprise:"SURPRISE ROUND"};
    modePill.textContent = `${round} · ${modeNames[currentMode]}`;
    modePill.classList.toggle("surprise-banner", currentMode === "surprise");
    modePill.classList.toggle("sound-mode", currentMode === "sound");
    dropZone.classList.toggle("show", currentMode === "feed");
    dropLabel.textContent = "Bring it here!";

    if(currentMode === "surprise") {
      qPrimary.textContent = currentLang === "te" ? "పండు ఏది?" : "फल कौन सा है?";
      qEnglish.textContent = "Which one is a fruit?";
      const fruit = DATA.fruits.items[Math.floor(Math.random()*DATA.fruits.items.length)];
      roundItem = fruit;
      const distractors = CATS.filter(k=>k!=="fruits").flatMap(k=>DATA[k].items).sort(()=>Math.random()-0.5).slice(0,2);
      shuffled.splice(0, shuffled.length, ...[fruit, ...distractors].sort(()=>Math.random()-0.5));
    } else if(currentMode === "feed") {
      qPrimary.textContent = currentLang === "te" ? `${roundItem.te} మిత్తుకి ఇవ్వు!` : `${roundItem.hi} मिथु को दो!`;
      qEnglish.textContent = `Feed Mithu the ${roundItem.en}.`;
    } else if(currentMode === "sound") {
      qPrimary.textContent = currentLang === "te" ? "విని సరైన బొమ్మను ఎంచుకో!" : "सुनो और सही तस्वीर चुनो!";
      qEnglish.textContent = "Listen carefully. Which picture did Mithu say?";
    } else {
      qPrimary.textContent = currentLang === "te" ? `${roundItem.te} ఎక్కడ?` : `${roundItem.hi} कहाँ है?`;
      qEnglish.textContent = `Where is the ${roundItem.en}?`;
    }
    qPrimary.lang = currentLang === "te" ? "te" : "hi";

    cardsEl.innerHTML = "";
    shuffled.forEach(item=>{
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.en = item.en;
      const label = currentLang === "te" ? item.te : item.hi;
      card.innerHTML = currentMode === "sound"
        ? `<div class="emoji">${item.emoji}</div><div class="label">Tap the picture</div>`
        : `<div class="emoji">${item.emoji}</div><div class="label" lang="${currentLang}">${label}</div>`;

      if(currentMode === "feed") {
        card.draggable = true;
        card.addEventListener("dragstart", e=>{ card.classList.add("dragging"); e.dataTransfer.setData("text/plain", item.en); });
        card.addEventListener("dragend", ()=>card.classList.remove("dragging"));
        card.onclick = ()=>{
          if(locked) return;
          if(item.en === roundItem.en){ card.classList.add("feeding"); }
          handleTap(item, card);
        };
      } else {
        card.onclick = ()=> handleTap(item, card);
      }
      cardsEl.appendChild(card);
    });

    speak(currentMode === "surprise" ? qPrimary.textContent : roundItem[currentLang], currentLang);
  }

  dropZone.addEventListener("dragover", e=>e.preventDefault());
  dropZone.addEventListener("drop", e=>{
    e.preventDefault();
    if(locked || currentMode !== "feed") return;
    const chosen = e.dataTransfer.getData("text/plain");
    const cardEl = [...cardsEl.querySelectorAll(".card")].find(c=>c.dataset.en===chosen);
    const item = pickPool().find(x=>x.en===chosen);
    if(item && cardEl) handleTap(item, cardEl);
  });

  function handleTap(item, cardEl){
    if(locked) return;
    if(item.en === roundItem.en){
      locked = true;
      correctCount++;
      cardEl.classList.add("correct");
      spawnSparkles(cardEl);
      updateStars();
      mithuEl.classList.remove("oops");
      void mithuEl.offsetWidth;
      mithuEl.classList.add("happy");
      const msgTe = CELEBRATIONS_TE[Math.floor(Math.random()*CELEBRATIONS_TE.length)];
      const msgHi = CELEBRATIONS_HI[Math.floor(Math.random()*CELEBRATIONS_HI.length)];
      showToast(currentLang === "te" ? msgTe : msgHi);
      setTimeout(()=> speak(roundItem[currentLang], currentLang), 300);
      setTimeout(()=>{ mithuEl.classList.remove("happy"); nextRound(); }, 1600);
    } else {
      wrongTries++;
      cardEl.classList.add("wrong");
      cardEl.classList.add("dim");
      mithuEl.classList.remove("happy");
      void mithuEl.offsetWidth;
      mithuEl.classList.add("oops");
      showToast(currentLang === "te" ? TRY_AGAIN_TE : TRY_AGAIN_HI, true);
      setTimeout(()=>{ cardEl.classList.remove("wrong"); mithuEl.classList.remove("oops"); }, 500);
    }
  }

  function updateStars(){
    const perStar = Math.ceil(TOTAL_ROUNDS/3);
    const numFilled = Math.min(3, Math.ceil(correctCount / perStar));
    filledStars = numFilled;
    starsEls.forEach((s,i)=> s.classList.toggle("filled", i < numFilled));
  }

  function spawnSparkles(cardEl){
    const rect = cardEl.getBoundingClientRect();
    const sceneRect = el("scene").getBoundingClientRect();
    for(let i=0;i<6;i++){
      const s = document.createElement("div");
      s.className = "sparkle";
      s.textContent = SPARKLE_EMOJIS[Math.floor(Math.random()*SPARKLE_EMOJIS.length)];
      const x = rect.left - sceneRect.left + rect.width/2 + (Math.random()*60-30);
      const y = rect.top - sceneRect.top + rect.height/2 + (Math.random()*20-10);
      s.style.left = x + "px";
      s.style.top = y + "px";
      s.style.animationDelay = (i*0.05)+"s";
      el("scene").appendChild(s);
      setTimeout(()=> s.remove(), 900);
    }
  }

  function showToast(text){
    toastEl.textContent = text;
    toastEl.classList.remove("show");
    void toastEl.offsetWidth;
    toastEl.classList.add("show");
  }

  function finishGame(){
    finishStars.textContent = "★".repeat(filledStars) + "☆".repeat(3 - filledStars);
    finishScreen.style.display = "flex";
  }

  function speak(text, lang){
    if(!('speechSynthesis' in window)) return;
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang === "te" ? "te-IN" : "hi-IN";
      u.rate = 0.85;
      u.pitch = 1.15;
      window.speechSynthesis.speak(u);
    }catch(e){ /* speech not available, fail silently */ }
  }
  el("replay-btn").onclick = ()=> roundItem && speak(roundItem[currentLang], currentLang);

})();
</script>
</body>
</html>
