<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Vageesh's Number Treasure Hunt</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap');
:root{--sky:#52c8ff;--deep:#164f32;--leaf:#2f9c5e;--leaf2:#76cc4f;--gold:#ffc52d;--gold2:#e89a13;--cream:#fff8df;--ink:#35200d;--coral:#ff655a;--purple:#7656da;--blue:#168de4;--green:#6dbd30;--shadow:rgba(45,32,12,.28)}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;font-family:'Nunito',sans-serif;background:#153e2c;overflow:hidden;color:var(--ink)} button{font:inherit}
.game{position:relative;width:100vw;height:100vh;min-height:620px;overflow:hidden;background:linear-gradient(#54cfff 0 32%,#8ee3ff 33%,#86d66d 72%,#55ab4f 100%)}
.sky-glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 19%,rgba(255,255,255,.85),transparent 26%),linear-gradient(to bottom,transparent 0 55%,rgba(255,255,255,.12));pointer-events:none}
.mountains{position:absolute;left:-8%;right:-8%;top:25%;height:42%;opacity:.9;background:linear-gradient(135deg,transparent 0 38%,#4ba061 39% 50%,transparent 51%) 0 0/31% 100% repeat-x;filter:drop-shadow(0 8px 12px rgba(14,74,55,.2))}
.waterfall{position:absolute;right:9%;top:26%;width:7%;height:34%;border-radius:40% 40% 55% 55%;background:linear-gradient(90deg,rgba(255,255,255,.72),#8cecff 42%,#d8faff 61%,rgba(255,255,255,.45));filter:drop-shadow(0 4px 9px rgba(0,120,180,.2));opacity:.92}
.river{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(180deg,#58cde7,#2faac8);clip-path:polygon(0 38%,18% 24%,37% 34%,57% 8%,78% 30%,100% 16%,100% 100%,0 100%)}
.river:after{content:'';position:absolute;inset:18% 0 0;background:repeating-linear-gradient(174deg,rgba(255,255,255,.28) 0 3px,transparent 3px 24px);opacity:.65}
.ground{position:absolute;left:-4%;right:-4%;bottom:11%;height:31%;background:linear-gradient(#d9b65f,#ba843f);border-radius:50% 46% 0 0/24% 18% 0 0;box-shadow:inset 0 10px 30px rgba(255,239,161,.28)}
.tree{position:absolute;top:-4%;width:18%;height:68%;background:linear-gradient(90deg,#633412,#9b5a21 44%,#5c2f11);border-radius:0 0 50% 45%;filter:drop-shadow(0 10px 12px rgba(0,0,0,.23));z-index:2} .tree.left{left:-8%;transform:rotate(-5deg)} .tree.right{right:-8%;transform:rotate(5deg)}
.canopy{position:absolute;z-index:3;width:38vw;height:26vh;background:radial-gradient(circle at 25% 70%,#77d650 0 15%,transparent 16%),radial-gradient(circle at 48% 34%,#2e9d59 0 23%,transparent 24%),radial-gradient(circle at 72% 57%,#4ebd54 0 22%,transparent 23%),radial-gradient(circle at 84% 12%,#1e7a47 0 19%,transparent 20%);filter:drop-shadow(0 8px 8px rgba(0,0,0,.15))} .canopy.l{left:-5%;top:-8%} .canopy.r{right:-5%;top:-7%;transform:scaleX(-1)}
.flower-bed{position:absolute;left:0;right:0;bottom:8%;height:12%;z-index:4;background:radial-gradient(circle,#ff6ea9 0 18%,transparent 20%) 5% 45%/70px 70px repeat-x,radial-gradient(circle,#ffd44a 0 16%,transparent 18%) 25% 65%/85px 85px repeat-x;opacity:.8;pointer-events:none}
.topbar{position:absolute;left:0;right:0;top:0;z-index:20;display:grid;grid-template-columns:72px 1fr 108px;align-items:center;gap:12px;padding:14px 18px}
.icon-btn{width:58px;height:58px;border:3px solid #fff3c7;border-radius:50%;background:linear-gradient(#ffbd35,#e88d11);box-shadow:0 5px 0 #b76809,0 8px 18px rgba(0,0,0,.2);cursor:pointer;color:white;font-size:28px;font-weight:900} .icon-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b76809}
.title-wrap{display:flex;justify-content:center;position:relative} .title{max-width:760px;width:min(64vw,760px);padding:11px 30px 13px;text-align:center;font-family:'Baloo 2';font-size:clamp(25px,3.1vw,46px);line-height:1;background:linear-gradient(#a55f21,#75380d);color:white;border:4px solid #5e2a08;border-radius:20px;box-shadow:0 6px 0 #4e2408,0 12px 28px rgba(0,0,0,.25);text-shadow:0 3px 0 rgba(0,0,0,.2)}
.starbox{justify-self:end;display:flex;align-items:center;gap:8px;background:white;border:3px solid #8559bf;border-radius:20px;padding:9px 13px;box-shadow:0 5px 0 rgba(85,45,130,.25);font-family:'Baloo 2';font-size:24px;font-weight:800} .starbox b{color:#ffb300;font-size:28px}
.step-pill{position:absolute;top:82px;left:50%;transform:translateX(-50%);z-index:21;background:linear-gradient(#704315,#4a280b);color:white;border:2px solid #2d1808;border-radius:999px;padding:4px 16px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.guide{position:absolute;left:2.2%;top:22%;width:min(28vw,330px);height:min(52vh,470px);z-index:12;display:flex;align-items:flex-end;justify-content:center;filter:drop-shadow(0 12px 12px rgba(0,0,0,.25))} .guide img{max-width:100%;max-height:100%;object-fit:contain}
.speech{position:absolute;left:28%;top:19%;z-index:14;width:min(47vw,670px);background:linear-gradient(#fffef7,#fff2cf);border:3px solid #e6b968;border-radius:34px;padding:18px 28px;text-align:center;font-family:'Baloo 2';font-weight:800;font-size:clamp(25px,3.5vw,50px);box-shadow:0 8px 0 rgba(158,104,31,.25),0 14px 25px rgba(0,0,0,.14)} .speech:after{content:'';position:absolute;left:-20px;bottom:20px;border-width:15px 22px 8px 0;border-style:solid;border-color:transparent #e6b968 transparent transparent;transform:rotate(-18deg)}
.answers{position:absolute;left:31%;right:19%;top:37%;height:30%;z-index:13;display:flex;align-items:center;justify-content:center;gap:clamp(14px,2vw,28px)}
.num-card,.group-card{border:none;cursor:pointer;min-width:110px;width:clamp(110px,13vw,175px);height:clamp(110px,16vh,165px);border-radius:25px;background:linear-gradient(#fffaf0,#f6e4bd);border:5px solid #a96322;box-shadow:0 9px 0 #7a4215,0 14px 20px rgba(0,0,0,.17);font-family:'Baloo 2';font-size:clamp(48px,6vw,82px);font-weight:800;color:#2b2014;transition:.16s transform,.16s filter,.16s box-shadow;position:relative;overflow:hidden}
.num-card:nth-child(1){color:#168ee9} .num-card:nth-child(2){color:#f04432} .num-card:nth-child(3){color:#56a91d} .num-card:hover,.group-card:hover{transform:translateY(-5px) scale(1.03);filter:brightness(1.04)} .num-card:active,.group-card:active{transform:translateY(4px);box-shadow:0 3px 0 #7a4215}
.num-card.correct,.group-card.correct{background:linear-gradient(#fff6a8,#ffd52f);border-color:#f4ae00;box-shadow:0 0 0 8px rgba(255,217,47,.28),0 0 35px #ffe66f,0 7px 0 #d18c00;animation:correctPop .52s ease} .num-card.wrong,.group-card.wrong{background:linear-gradient(#ffd0ca,#ff796a);animation:wiggle .45s ease}
@keyframes correctPop{50%{transform:scale(1.12)}} @keyframes wiggle{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.object-line{position:absolute;left:32%;right:18%;top:34%;z-index:16;text-align:center;font-size:clamp(42px,6vw,75px);filter:drop-shadow(0 4px 3px rgba(0,0,0,.12));pointer-events:none}
.path{position:absolute;left:24%;right:9%;bottom:9.5%;height:15%;z-index:11;display:flex;align-items:center;justify-content:space-between;padding:0 2%} .path:before{content:'';position:absolute;left:4%;right:3%;top:50%;border-top:7px dotted rgba(255,255,255,.92);filter:drop-shadow(0 2px 1px rgba(70,50,20,.4));z-index:-1}
.stone{width:clamp(56px,7vw,92px);height:clamp(44px,6vw,72px);border-radius:48% 52% 44% 50%;background:linear-gradient(#edd5a4,#b98a50);border:3px solid #8e6438;box-shadow:0 7px 0 #75502e,0 10px 16px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-size:clamp(24px,3vw,38px);font-weight:800;transition:.35s} .stone.lit{background:linear-gradient(#fff09b,#ffc72f);border-color:#e59b00;box-shadow:0 0 0 6px rgba(255,218,44,.28),0 0 25px #ffe15b,0 7px 0 #b87a00}
.start{position:absolute;left:21%;bottom:20.5%;z-index:10;background:#6abd35;color:white;border:3px solid #3b7f1e;border-radius:9px;padding:5px 12px;font-family:'Baloo 2';font-weight:800;font-size:20px;box-shadow:0 4px 0 #2b6317}
.chest-wrap{position:absolute;right:3%;bottom:13%;z-index:12;width:min(18vw,210px);filter:drop-shadow(0 10px 10px rgba(0,0,0,.3));transition:.4s transform} .chest-wrap.open{animation:chestBounce .7s ease} @keyframes chestBounce{40%{transform:translateY(-18px) scale(1.08)}70%{transform:rotate(-4deg) scale(1.05)}}
.chest-svg{width:100%;height:auto;overflow:visible} .lid{transform-origin:50% 65%;transition:.55s transform} .open .lid{transform:translateY(-22px) rotate(-15deg)} .glow{opacity:0;transition:.5s} .open .glow{opacity:1;animation:pulse 1s ease infinite alternate} @keyframes pulse{to{opacity:.65}}
.footer{position:absolute;left:50%;bottom:1.2%;transform:translateX(-50%);z-index:25;display:flex;align-items:center;gap:14px;width:min(760px,88vw);padding:9px 18px;border-radius:22px;background:linear-gradient(#fffdf4,#ffe7af);border:3px solid #e0a955;box-shadow:0 5px 0 #ae7729;font-weight:800;font-size:clamp(14px,1.6vw,20px)} .sound{width:44px;height:44px;border:0;border-radius:50%;background:linear-gradient(#55bfff,#198be8);color:white;font-size:22px;box-shadow:0 4px 0 #0f63af;cursor:pointer}
.progress-avatar{position:absolute;width:72px;height:72px;z-index:17;transform:translate(-50%,-95%);filter:drop-shadow(0 7px 7px rgba(0,0,0,.32));transition:left .72s cubic-bezier(.34,1.56,.64,1),top .72s cubic-bezier(.34,1.56,.64,1)} .progress-avatar img{width:100%;height:100%;object-fit:contain} .progress-avatar.hop{animation:hop .72s ease} @keyframes hop{45%{transform:translate(-50%,-150%) rotate(-5deg) scale(1.07)}}
.toast{position:absolute;left:50%;top:31%;transform:translate(-50%,-10px);z-index:40;padding:10px 20px;border-radius:999px;color:white;font-family:'Baloo 2';font-size:21px;font-weight:800;opacity:0;pointer-events:none;transition:.25s} .toast.show{opacity:1;transform:translate(-50%,0)} .toast.good{background:#3aae61} .toast.bad{background:#f05d55}
.fx{position:fixed;inset:0;z-index:60;pointer-events:none} .spark{position:absolute;width:11px;height:11px;background:radial-gradient(circle,#fff 0 25%,#ffd322 28% 60%,transparent 65%);border-radius:50%;animation:spark .85s ease-out forwards} @keyframes spark{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
.win{position:absolute;inset:0;z-index:80;background:rgba(21,57,39,.58);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.35s} .win.show{opacity:1;pointer-events:auto} .win-card{width:min(520px,88vw);padding:30px;border-radius:30px;background:linear-gradient(#fff9dd,#ffedaf);border:5px solid #d49525;text-align:center;box-shadow:0 20px 55px rgba(0,0,0,.35);transform:scale(.82);transition:.35s} .win.show .win-card{transform:scale(1)} .win-card h2{font-family:'Baloo 2';font-size:38px;margin:0;color:#6c3c12} .win-card p{font-size:20px;font-weight:800} .again{border:0;border-radius:999px;padding:12px 28px;background:linear-gradient(#7dd64b,#4ba92f);color:white;font-family:'Baloo 2';font-weight:800;font-size:20px;box-shadow:0 5px 0 #347b21;cursor:pointer}
.group-card{font-size:clamp(26px,3vw,40px);padding:10px;width:clamp(135px,15vw,195px)} .seq{display:flex;align-items:center;gap:8px} .seq span{width:55px;height:55px;border-radius:45%;display:flex;align-items:center;justify-content:center;background:#ddc18f;border:3px solid #997148;font-family:'Baloo 2';font-size:28px;font-weight:800} .seq span.blank{background:#fff1cf;border-style:dashed;border-color:#f05d55;color:#f05d55}
@media(max-width:800px){.game{min-height:560px}.topbar{grid-template-columns:54px 1fr 80px;padding:8px}.icon-btn{width:48px;height:48px}.starbox{font-size:18px;padding:7px}.title{width:68vw;font-size:25px}.step-pill{top:64px;font-size:13px}.guide{left:0;top:29%;width:27vw;height:36vh}.speech{left:25%;top:17%;width:68vw;padding:12px;font-size:27px}.answers{left:28%;right:4%;top:38%;height:29%}.object-line{left:28%;right:4%;top:34%}.path{left:12%;right:4%;bottom:10%;height:12%}.start{left:6%;bottom:20%}.chest-wrap{right:1%;bottom:15%;width:18vw}.footer{bottom:1%;padding:5px 11px}}
@media(max-height:700px){.guide{top:25%;height:45vh}.speech{top:18%;font-size:30px}.answers{top:38%;height:28%}.path{bottom:10%;height:13%}.footer{font-size:14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="game" id="game">
  <div class="sky-glow"></div><div class="mountains"></div><div class="waterfall"></div><div class="river"></div><div class="ground"></div><div class="tree left"></div><div class="tree right"></div><div class="canopy l"></div><div class="canopy r"></div><div class="flower-bed"></div>
  <div class="topbar"><button class="icon-btn" id="restart" aria-label="Restart">↻</button><div class="title-wrap"><div class="title">Number Treasure Hunt</div></div><div class="starbox"><b>★</b><span id="score">0 / 5</span></div></div>
  <div class="step-pill" id="stepLabel">Clue 1 of 5</div>
  <div class="guide"><img src="/assets/images/vageesh.png" alt="Vageesh" /></div>
  <div class="speech" id="prompt">Find number 2!</div>
  <div class="object-line" id="objects"></div>
  <div class="answers" id="answers"></div>
  <div class="start">START</div>
  <div class="path" id="path"><div class="stone" data-step="0">1</div><div class="stone" data-step="1">2</div><div class="stone" data-step="2">3</div><div class="stone" data-step="3">4</div><div class="stone" data-step="4">5</div></div>
  <div class="progress-avatar" id="walker"><img src="/assets/images/vageesh.png" alt="Vageesh moving on the path"></div>
  <div class="chest-wrap" id="chest">
    <svg class="chest-svg" viewBox="0 0 240 210" aria-label="Treasure chest">
      <defs><linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f07f2b"/><stop offset="1" stop-color="#9f3217"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe15b"/><stop offset="1" stop-color="#d89000"/></linearGradient><radialGradient id="glow"><stop stop-color="#fffbd0"/><stop offset=".35" stop-color="#ffd52a" stop-opacity=".9"/><stop offset="1" stop-color="#ffd52a" stop-opacity="0"/></radialGradient></defs>
      <ellipse class="glow" cx="120" cy="98" rx="110" ry="95" fill="url(#glow)"/>
      <g class="lid"><path d="M30 92 Q38 30 120 28 Q202 30 210 92Z" fill="url(#wood)" stroke="#62200d" stroke-width="7"/><path d="M39 82 H201" stroke="url(#gold)" stroke-width="17"/><path d="M68 42 V90M172 42V90" stroke="url(#gold)" stroke-width="13"/></g>
      <rect x="30" y="88" width="180" height="102" rx="10" fill="url(#wood)" stroke="#62200d" stroke-width="7"/><path d="M34 108 H206M34 165H206" stroke="url(#gold)" stroke-width="15"/><path d="M68 94 V185M172 94V185" stroke="url(#gold)" stroke-width="13"/><rect x="98" y="112" width="44" height="54" rx="8" fill="url(#gold)" stroke="#8c5800" stroke-width="5"/><circle cx="120" cy="137" r="8" fill="#7c4a00"/><rect x="116" y="137" width="8" height="16" rx="4" fill="#7c4a00"/></svg>
  </div>
  <div class="footer"><button class="sound" id="listen" aria-label="Listen">🔊</button><span>Listen to the clue. Tap the correct answer!</span></div>
  <div class="toast" id="toast"></div><div class="fx" id="fx"></div>
  <div class="win" id="win"><div class="win-card"><div style="font-size:64px">🏆✨</div><h2>You found the treasure!</h2><p>చాలా బాగా కృషావు!</p><button class="again" id="again">Play Again</button></div></div>
</div>
<script>
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const state={step:0,clues:[]};
const EMOJIS=['🍎','🍌','⭐','🎈','🐘','🦋'];
const PATH_POS=[18,34,50,66,82];
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function distractors(target,pool,n=2){return shuffle(pool.filter(x=>x!==target)).slice(0,n)}
function gen1(){const target=rand(1,5);return{type:'find',target,options:shuffle([target,...distractors(target,[1,2,3,4,5])]),prompt:`Find number ${target}!`}}
function gen2(){const count=rand(1,5),emoji=EMOJIS[rand(0,EMOJIS.length-1)];return{type:'count',target:count,count,emoji,options:shuffle([count,...distractors(count,[1,2,3,4,5])]),prompt:`How many do you see?`}}
function gen3(){const target=rand(2,5);let counts=shuffle([target,...distractors(target,[1,2,3,4,5])]);return{type:'group',target,groups:counts.map((c,i)=>({count:c,emoji:EMOJIS[(i+2)%EMOJIS.length]})),prompt:`Find the group with ${target}!`}}
function gen4(){const start=rand(1,3),seq=[start,start+1,start+2,start+3],blank=rand(1,2),target=seq[blank];return{type:'sequence',target,seq,blank,options:shuffle([target,...distractors(target,[1,2,3,4,5,6])]),prompt:'Fill the missing stepping stone!'}}
function gen5(){const target=rand(1,5);return{type:'lock',target,options:shuffle([target,...distractors(target,[1,2,3,4,5])]),prompt:`The treasure key is ${target}!`}}
function newGame(){state.step=0;state.clues=[gen1(),gen2(),gen3(),gen4(),gen5()];document.querySelectorAll('.stone').forEach(s=>s.classList.remove('lit'));document.getElementById('chest').classList.remove('open');document.getElementById('win').classList.remove('show');document.getElementById('score').textContent='0 / 5';moveWalker(0,false);render()}
function render(){const c=state.clues[state.step],ans=document.getElementById('answers'),obj=document.getElementById('objects');ans.innerHTML='';obj.textContent='';document.getElementById('prompt').textContent=c.prompt;document.getElementById('stepLabel').textContent=`Clue ${state.step+1} of 5`;
  if(c.type==='count')obj.textContent=c.emoji.repeat(c.count);
  if(c.type==='find'||c.type==='count'||c.type==='lock') c.options.forEach((n,i)=>ans.appendChild(numButton(n,n===c.target,i)));
  if(c.type==='group') c.groups.forEach((g,i)=>{const b=document.createElement('button');b.className='group-card';b.innerHTML=`<div style="font-size:38px;letter-spacing:3px">${g.emoji.repeat(g.count)}</div><div style="font-size:20px;margin-top:4px">Tap</div>`;b.onclick=e=>answer(g.count===c.target,e.currentTarget);ans.appendChild(b)});
  if(c.type==='sequence'){const box=document.createElement('div');box.style.display='flex';box.style.flexDirection='column';box.style.alignItems='center';box.style.gap='18px';const seq=document.createElement('div');seq.className='seq';c.seq.forEach((n,i)=>{const s=document.createElement('span');s.textContent=i===c.blank?'?':n;if(i===c.blank)s.className='blank';seq.appendChild(s)});box.appendChild(seq);const row=document.createElement('div');row.style.display='flex';row.style.gap='18px';c.options.forEach((n,i)=>row.appendChild(numButton(n,n===c.target,i)));box.appendChild(row);ans.appendChild(box)}
}
function numButton(n,correct,i){const b=document.createElement('button');b.className='num-card';b.textContent=n;b.dataset.correct=correct;b.onclick=e=>answer(correct,e.currentTarget);return b}
function answer(correct,btn){const buttons=[...document.querySelectorAll('#answers button')];buttons.forEach(b=>b.disabled=true);if(correct){btn.classList.add('correct');burst(btn);toast('✨ Correct!','good');document.querySelector(`.stone[data-step="${state.step}"]`).classList.add('lit');document.getElementById('score').textContent=`${state.step+1} / 5`;setTimeout(advance,720)}else{btn.classList.add('wrong');toast('మళ్లీ ఆలోచించండి!','bad');setTimeout(()=>{btn.classList.remove('wrong');buttons.forEach(b=>b.disabled=false)},650)}}
function advance(){state.step++;if(state.step>=5){moveWalker(5);openChest();return}moveWalker(state.step);render()}
function moveWalker(step,animate=true){const w=document.getElementById('walker');const left=step>=5?89:24+PATH_POS[step]*.73;w.style.left=left+'%';w.style.top='82%';if(animate&&!reduceMotion){w.classList.remove('hop');void w.offsetWidth;w.classList.add('hop')}}
function openChest(){const c=document.getElementById('chest');c.classList.add('open');for(let i=0;i<5;i++)setTimeout(()=>burst(c,18),i*120);setTimeout(()=>document.getElementById('win').classList.add('show'),900)}
function toast(text,type){const t=document.getElementById('toast');t.textContent=text;t.className='toast show '+type;setTimeout(()=>t.className='toast',1050)}
function burst(el,count=12){const r=el.getBoundingClientRect(),fx=document.getElementById('fx');for(let i=0;i<count;i++){const s=document.createElement('i');s.className='spark';const a=Math.PI*2*i/count,dist=45+Math.random()*55;s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--dx',Math.cos(a)*dist+'px');s.style.setProperty('--dy',Math.sin(a)*dist+'px');fx.appendChild(s);setTimeout(()=>s.remove(),900)}}
function speak(){const c=state.clues[state.step];if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(c.prompt);u.rate=.9;u.pitch=1.12;window.speechSynthesis.speak(u)}
document.getElementById('restart').onclick=newGame;document.getElementById('again').onclick=newGame;document.getElementById('listen').onclick=speak;newGame();
</script>
</body>
</html>
